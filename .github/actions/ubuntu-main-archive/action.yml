name: Use the main Ubuntu archive
description: Point apt at archive.ubuntu.com instead of the runner's regional mirror.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # The runner's regional mirror (Azure or AWS, varying by image) can stall for many
        # minutes; send apt to the main archive whatever host it is (as Mesh PR 487).
        for file in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*; do
          [ -f "$file" ] || continue
          sudo sed -i -E 's#https?://[a-z0-9.-]+\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$file"
        done
        hosts=$(grep -rhoE 'https?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | sort -u || true)
        printf '%s\n' "${hosts:-none found}" | sed 's/^/apt archive host: /'
