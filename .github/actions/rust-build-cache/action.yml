name: Rust object cache
description: Restore compiler objects independently of Cargo build artifacts
runs:
  using: composite
  steps:
    - shell: bash
      run: echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
    - uses: actions/cache@v4
      id: objects
      with:
        path: ${{ runner.temp }}/sccache
        key: rust-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
        restore-keys: |
          rust-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-
          rust-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
    - name: Install pinned sccache through the authenticated release API
      shell: bash
      run: |
        set -euo pipefail
        stage=$(mktemp -d "$RUNNER_TEMP/sccache-download.XXXXXXXX")
        trap 'rm -rf -- "$stage"' EXIT
        archive=sccache-v0.19.0-x86_64-unknown-linux-musl.tar.gz
        url="https://github.com/mozilla/sccache/releases/download/v0.19.0/$archive"
        node "$GITHUB_WORKSPACE/tools/ci-release-download.ts" "$url" "$stage/$archive"
        node "$GITHUB_WORKSPACE/tools/ci-release-download.ts" "$url.sha256" "$stage/checksum"
        printf '%s  %s\n' "$(cat "$stage/checksum")" "$stage/$archive" | sha256sum --check
        mkdir -p "$RUNNER_TEMP/sccache-bin"
        tar -xzf "$stage/$archive" --strip-components=1 -C "$RUNNER_TEMP/sccache-bin"
        "$RUNNER_TEMP/sccache-bin/sccache" --version | grep -Fx 'sccache 0.19.0'
        echo "$RUNNER_TEMP/sccache-bin" >> "$GITHUB_PATH"
    - shell: bash
      run: echo "sccache exact object cache hit=${{ steps.objects.outputs.cache-hit }} (see cache restore step for matched key)"
