name: Authenticated CI tools
description: Install the selected Bun and Node versions without public release endpoints
inputs:
  bun-version:
    description: Exact Bun version
    required: true
  node-version:
    description: Optional Node major or exact version
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CI_BUN_VERSION: ${{ inputs.bun-version }}
        CI_NODE_VERSION: ${{ inputs.node-version }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node "$GITHUB_WORKSPACE/tools/ci-bootstrap-tools.ts"
