name: Program family release

# Builds the program families with their own prepare:package routes, then stages, packs and
# verifies the release-tarball closure with scripts/program-release.ts. Publishing is opt-in.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing programs-v<version> tag on main with npm runtime-input support
        required: true
        type: string
      runtime_url:
        description: Exact @waffle-os/runtime npm tarball URL
        required: true
        type: string
      runtime_sha256:
        description: SHA-256 of the runtime tarball
        required: true
        type: string
      families:
        description: Comma-separated top-level families (base, git, python)
        default: base
        type: string
      registry:
        description: npm registry for declared third-party pins (Git needs one)
        default: ""
        type: string
      publish:
        description: Publish the verified packages to npm and attach their receipt to the GitHub release
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: program-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ github.token }}
  BUN_VERSION: "1.4.4"
  NODE_VERSION: "26.12.1"
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  release:
    name: Qualify and stage program families
    runs-on: ubuntu-26.04
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      staged_artifact: ${{ steps.staged.outputs.artifact-id }}
    env:
      FAMILIES: ${{ inputs.families }}
      WASI_SDK_PATH: ${{ github.workspace }}/.build/wasi-sdk-34.0-x86_64-linux
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}
      - name: Verify the checkout is exactly the tag and on main
        id: source
        run: |
          [[ "$RELEASE_TAG" =~ ^programs-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit=$(git rev-parse HEAD)
          test "$commit" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Verify the tag uses the workflow publisher
        if: inputs.publish
        run: |
          if ! git diff --quiet "$GITHUB_WORKFLOW_SHA" HEAD -- scripts/publish-programs-npm.ts; then
            echo 'The release tag must use the same npm publisher as the workflow revision.' >&2
            exit 1
          fi
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/program-optimizer
      - uses: ./.github/actions/setup-wasmtime
        if: contains(format(',{0},', inputs.families), ',python,')
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-wasip1
      - name: Restore wasi-sdk
        id: wasi-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.WASI_SDK_PATH }}
          key: wasi-sdk-34.0-x86_64-linux-b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
      - name: Download wasi-sdk
        if: steps.wasi-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive=$(mktemp "$RUNNER_TEMP/release-wasi-sdk-XXXXXX.tar.gz")
          trap 'rm -f -- "$archive"' EXIT
          node "$GITHUB_WORKSPACE/tools/ci-release-download.ts" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz "$archive"
          printf '%s  %s\n' b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4 "$archive" | sha256sum --check --status
          mkdir -p "$(dirname "$WASI_SDK_PATH")"
          tar -xzf "$archive" -C "$(dirname "$WASI_SDK_PATH")"
      - name: Cache program builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry
            ~/.cargo/git
            target
            .build/wasi-libc
            .build/program-locales
            .build/coreutils
            .build/findutils
            .build/grep
            .build/sed
            .build/ripgrep
            packages/ripgrep/.sources
          key: ${{ runner.os }}-${{ runner.arch }}-program-release-${{ hashFiles('bun.lock', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'tools/program-*.ts', 'tools/program-locales/**', 'packages/**/*.rs', 'packages/**/Cargo.toml', 'packages/**/Cargo.lock', 'packages/*/scripts/**', 'packages/*/patches/**') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test scripts/program-release.test.ts scripts/publish-programs-npm.test.ts
      - name: Prepare every family in the closure with its own route
        env:
          WASI_LIBC_SCRATCH_ROOT: ${{ runner.temp }}
        run: |
          set -euo pipefail
          named_programs="$RUNNER_TEMP/waffle-named-programs"
          mkdir "$named_programs"
          directories=$(bun scripts/program-release.ts --list --families "$FAMILIES")
          for directory in $directories; do
            if [ "$directory" = python ]; then
              export PATH="$HOME/downloader/bin:$PATH"
              producer="$RUNNER_TEMP/waffle-python-producer"
              node packages/python/scripts/build-python.ts --output "$producer" \
                --work "$RUNNER_TEMP/waffle-python-build"
              checksum=$(sha256sum "$producer/python-build.json")
              bun run --cwd packages/python prepare:package --receipt-sha256 "${checksum%% *}" "$producer"
              continue
            fi
            WAFFLE_NAMED_PROGRAMS_DIR="$named_programs" \
              bun run --cwd "packages/$directory" --if-present prepare:package
          done
      - name: Stage, pack and verify the release closure
        id: closure
        env:
          RUNTIME_URL: ${{ inputs.runtime_url }}
          RUNTIME_SHA256: ${{ inputs.runtime_sha256 }}
          REGISTRY: ${{ inputs.registry }}
        run: |
          set -euo pipefail
          named_programs="$RUNNER_TEMP/waffle-named-programs"
          bun scripts/program-release.ts --tag "$RELEASE_TAG" --require-tag --families "$FAMILIES" \
            --runtime-url "$RUNTIME_URL" --runtime-sha256 "$RUNTIME_SHA256" \
            --named-programs-dir "$named_programs" \
            ${REGISTRY:+--registry "$REGISTRY"} --out .build/program-release
          if compgen -G "$named_programs/*-named.wasm" >/dev/null; then
            printf 'named=true\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        id: staged
        with:
          name: program-release-${{ inputs.tag }}-${{ github.run_attempt }}
          path: .build/program-release/assets
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.closure.outputs.named == 'true'
        with:
          name: program-named-${{ inputs.tag }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/waffle-named-programs
          if-no-files-found: error
      - uses: ./.github/actions/save-release-downloads
        if: always() && env.CI_RELEASE_CACHE_INITIAL != ''

  publish:
    name: Publish the staged program families
    needs: release
    if: inputs.publish
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      SOURCE_COMMIT: ${{ needs.release.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.source_commit }}
      - name: Verify the publication source still matches the tag
        run: |
          test "$SOURCE_COMMIT" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release.outputs.staged_artifact }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: .build/program-release/assets
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - name: Read the receipt for an existing release
        id: prior_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -c --arg tag "$RELEASE_TAG" \
              '[.[][] | select(.tag_name == $tag)] | if length > 1 then error("Multiple releases for the tag") else .[0] end')
          if [ "$release" = null ]; then exit 0; fi
          asset=$(jq -c '[.assets[] | select(.name == "program-release.json")]
            | if length > 1 then error("Multiple assets for the receipt") else .[0] end' \
            <<< "$release")
          asset_id=$(jq -r 'select(.state == "uploaded") | .id' <<< "$asset")
          if [ -n "$asset_id" ]; then
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > .build/program-release/existing-receipt.json
          else
            if ! digest=$(jq -er 'select(.draft and (.assets == [] or (.assets | length == 1
              and .[0].name == "program-release.json" and .[0].state == "starter" and .[0].size == 0)))
              | (.body // "") | split("\n")[0]
              | capture("^<!-- waffle-npm-receipt-sha256=(?<digest>[a-f0-9]{64}) -->$").digest' <<< "$release"); then
              echo 'Expected an uploaded program release receipt or a draft with a receipt digest and no completed assets.' >&2
              exit 1
            fi
            printf 'receipt_sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
            starter_id=$(jq -r 'select(.state == "starter") | .id' <<< "$asset")
            printf 'starter_id=%s\n' "$starter_id" >> "$GITHUB_OUTPUT"
          fi
          draft_id=$(jq -r 'select(.draft) | .id' <<< "$release")
          printf 'draft_id=%s\n' "$draft_id" >> "$GITHUB_OUTPUT"
      - name: Publish program packages to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          EXISTING_RECEIPT_SHA256: ${{ steps.prior_release.outputs.receipt_sha256 }}
        run: |
          set -euo pipefail
          jq -e --arg commit "$SOURCE_COMMIT" --arg tag "$RELEASE_TAG" \
            '.sourceCommit == $commit and .tag == $tag and .tagState == "tagged" and .dirty == false' \
            .build/program-release/assets/program-release.json > /dev/null
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          receipt_args=()
          existing=.build/program-release/existing-receipt.json
          if [ -f "$existing" ]; then
            receipt_args=(--existing-receipt "$existing")
          elif [ -n "$EXISTING_RECEIPT_SHA256" ]; then
            receipt_args=(--existing-receipt-sha256 "$EXISTING_RECEIPT_SHA256")
          fi
          bun scripts/publish-programs-npm.ts .build/program-release/assets \
            .build/program-release/program-release.json "${receipt_args[@]}"
      - name: Publish the npm closure receipt
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_ID: ${{ steps.prior_release.outputs.draft_id }}
          STARTER_ID: ${{ steps.prior_release.outputs.starter_id }}
          EXISTING_RECEIPT_SHA256: ${{ steps.prior_release.outputs.receipt_sha256 }}
        run: |
          set -euo pipefail
          receipt=.build/program-release/program-release.json
          existing=.build/program-release/existing-receipt.json
          if [ -n "$DRAFT_ID" ]; then
            if [ -n "$STARTER_ID" ]; then
              marker="<!-- waffle-npm-receipt-sha256=$EXISTING_RECEIPT_SHA256 -->"
              gh api "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" |
                jq -e --arg tag "$RELEASE_TAG" --arg marker "$marker" --argjson id "$STARTER_ID" \
                  '.draft and .tag_name == $tag and (.body | split("\n")[0]) == $marker
                    and (.assets | length == 1 and .[0].id == $id and .[0].name == "program-release.json"
                    and .[0].state == "starter" and .[0].size == 0)' >/dev/null
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$STARTER_ID" >/dev/null
            fi
            if [ ! -f "$existing" ]; then gh release upload "$RELEASE_TAG" "$receipt"; fi
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" -F draft=false >/dev/null
          elif [ ! -f "$existing" ]; then
            digest=$(sha256sum "$receipt")
            gh release create "$RELEASE_TAG" "$receipt" --verify-tag --title "$RELEASE_TAG" \
              --generate-notes --notes "<!-- waffle-npm-receipt-sha256=${digest%% *} -->"
          fi
      - uses: ./.github/actions/save-release-downloads
        if: always() && env.CI_RELEASE_CACHE_INITIAL != ''
