name: Program family release

# Builds the program families with their own prepare:package routes, then stages, packs and
# verifies the release-tarball closure with scripts/program-release.ts. Publishing is opt-in.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing programs-v<version> tag on main with npm runtime-input support
        required: true
        type: string
      runtime_url:
        description: Exact @waffle-os/runtime npm tarball URL
        required: true
        type: string
      runtime_sha256:
        description: SHA-256 of the runtime tarball
        required: true
        type: string
      families:
        description: Comma-separated top-level families (base, git)
        default: base
        type: string
      registry:
        description: npm registry for declared third-party pins (Git needs one)
        default: ""
        type: string
      publish:
        description: Publish the verified packages to npm and attach their receipt to the GitHub release
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: program-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BUN_VERSION: "1.4.4"
      RELEASE_TAG: ${{ inputs.tag }}
      FAMILIES: ${{ inputs.families }}
      WASI_SDK_PATH: ${{ github.workspace }}/.build/wasi-sdk-34.0-x86_64-linux
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}
      - name: Verify the checkout is exactly the tag, on main, and names no Python
        run: |
          [[ "$RELEASE_TAG" =~ ^programs-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          # Python stages a qualified interpreter artifact; release it with the local CLI.
          [[ ",$FAMILIES," != *",python,"* ]]
      - name: Verify the tag uses the workflow publisher
        if: inputs.publish
        run: |
          if ! git diff --quiet "$GITHUB_WORKFLOW_SHA" HEAD -- scripts/publish-programs-npm.ts; then
            echo 'The release tag must use the same npm publisher as the workflow revision.' >&2
            exit 1
          fi
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ./.github/actions/program-optimizer
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-wasip1
      - name: Restore wasi-sdk
        id: wasi-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.WASI_SDK_PATH }}
          key: wasi-sdk-34.0-x86_64-linux-b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
      - name: Download wasi-sdk
        if: steps.wasi-sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive=$(mktemp "$RUNNER_TEMP/release-wasi-sdk-XXXXXX.tar.gz")
          trap 'rm -f -- "$archive"' EXIT
          node "$GITHUB_WORKSPACE/tools/ci-release-download.ts" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz "$archive"
          printf '%s  %s\n' b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4 "$archive" | sha256sum --check --status
          mkdir -p "$(dirname "$WASI_SDK_PATH")"
          tar -xzf "$archive" -C "$(dirname "$WASI_SDK_PATH")"
      - name: Cache program builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry
            ~/.cargo/git
            target
            .build/wasi-libc
            .build/program-locales
            .build/coreutils
            .build/findutils
            .build/grep
            .build/sed
            .build/ripgrep
            packages/ripgrep/.sources
          key: ${{ runner.os }}-${{ runner.arch }}-program-release-${{ hashFiles('bun.lock', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'tools/program-*.ts', 'tools/program-locales/**', 'packages/**/*.rs', 'packages/**/Cargo.toml', 'packages/**/Cargo.lock', 'packages/*/scripts/**', 'packages/*/patches/**') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test scripts/program-release.test.ts scripts/publish-programs-npm.test.ts
      - name: Prepare every family in the closure with its own route
        run: |
          for directory in $(bun scripts/program-release.ts --list --families "$FAMILIES"); do
            bun run --cwd "packages/$directory" --if-present prepare:package
          done
      - name: Stage, pack and verify the release closure
        env:
          RUNTIME_URL: ${{ inputs.runtime_url }}
          RUNTIME_SHA256: ${{ inputs.runtime_sha256 }}
          REGISTRY: ${{ inputs.registry }}
        run: |
          bun scripts/program-release.ts --tag "$RELEASE_TAG" --require-tag --families "$FAMILIES" \
            --runtime-url "$RUNTIME_URL" --runtime-sha256 "$RUNTIME_SHA256" \
            ${REGISTRY:+--registry "$REGISTRY"} --out .build/program-release
      - uses: actions/upload-artifact@v4
        with:
          name: program-release-${{ inputs.tag }}
          path: .build/program-release/assets
          if-no-files-found: error
      - name: Read the receipt for an existing release
        id: prior_release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -c --arg tag "$RELEASE_TAG" \
              '[.[][] | select(.tag_name == $tag)] | if length > 1 then error("Multiple releases for the tag") else .[0] end')
          if [ "$release" = null ]; then exit 0; fi
          asset_id=$(jq -er '[.assets[] | select(.name == "program-release.json")]
            | if length == 1 then .[0].id else error("Expected one existing program release receipt") end' \
            <<< "$release")
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            > .build/program-release/existing-receipt.json
          draft_id=$(jq -r 'select(.draft) | .id' <<< "$release")
          printf 'draft_id=%s\n' "$draft_id" >> "$GITHUB_OUTPUT"
      - name: Publish program packages to npm
        if: inputs.publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          receipt_args=()
          existing=.build/program-release/existing-receipt.json
          if [ -f "$existing" ]; then receipt_args=(--existing-receipt "$existing"); fi
          bun scripts/publish-programs-npm.ts .build/program-release/assets \
            .build/program-release/program-release.json "${receipt_args[@]}"
      - name: Publish the npm closure receipt
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_ID: ${{ steps.prior_release.outputs.draft_id }}
        run: |
          set -euo pipefail
          if [ ! -f .build/program-release/existing-receipt.json ]; then
            gh release create "$RELEASE_TAG" .build/program-release/program-release.json \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          elif [ -n "$DRAFT_ID" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" -F draft=false >/dev/null
          fi
      - uses: ./.github/actions/save-release-downloads
        if: always() && env.CI_RELEASE_CACHE_INITIAL != ''
