name: Waffle runtime release

on:
  push:
    tags:
      - "waffle-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing waffle-v<version> tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BUN_VERSION: "1.4.4"
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/packages/waffle/target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - name: Cache release package dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry
            ~/.cargo/git
            packages/waffle/target
          key: ${{ runner.os }}-${{ runner.arch }}-waffle-release-${{ hashFiles('bun.lock', 'packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml', 'packages/waffle/network/**/*.rs') }}
      - run: bun install --frozen-lockfile
      - name: Pack the prepared runtime package
        run: bun run --cwd packages/waffle pack
      - name: Write the archive checksum
        id: archive
        run: |
          archive=$(find packages/waffle/dist -maxdepth 1 -type f -name '*.tgz' -print -quit)
          test -n "$archive"
          sha256sum "$archive" > "$archive.sha256"
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - name: Publish the GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "${{ steps.archive.outputs.path }}" "${{ steps.archive.outputs.path }}.sha256" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
