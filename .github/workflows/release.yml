name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  release:
    name: Version or publish @waffle-os/runtime and @waffle-os/relay to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUN_VERSION: "1.4.4"
      CARGO_TARGET_DIR: ${{ github.workspace }}/packages/waffle/target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/release-downloads

      - uses: ./.github/actions/setup-tools
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      - name: Restore exact runtime network artifact
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/waffle/browser/net/network.wasm
            packages/waffle/browser/net/network.input-hash
            packages/waffle/browser/net/network.sha256
            packages/waffle/browser/net/network.buffer.js
            packages/waffle/browser/net/network.buffer.sha256
            packages/waffle/browser/net/network.growth.json
          key: network-wasm-v2-${{ hashFiles('packages/waffle/Cargo.toml', 'packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml', 'packages/waffle/network/Cargo.toml', 'packages/waffle/network/src/**', 'packages/waffle/tooling/build-network.ts', 'packages/waffle/tooling/network-translator.ts', 'packages/waffle/tooling/network-translator/**', 'packages/waffle/tooling/network-growth.ts') }}

      - name: Cache release package dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry
            ~/.cargo/git
            packages/waffle/target
          key: ${{ runner.os }}-${{ runner.arch }}-waffle-release-${{ hashFiles('bun.lock', 'packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml', 'packages/waffle/network/**/*.rs') }}

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Configure npm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi

      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v2
        with:
          version-script: bun run release:version
          publish-script: bun run release:publish
          create-github-releases: true
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - uses: ./.github/actions/save-release-downloads
        if: always() && env.CI_RELEASE_CACHE_INITIAL != ''
