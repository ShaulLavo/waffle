name: Rust threads fixture

on:
  workflow_call:
    outputs:
      artifact-id:
        description: Exact verified Rust threads fixture artifact
        value: ${{ jobs.producer.outputs.artifact-id }}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-threads-fixture-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  producer:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.fixture.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: "1.4.4"
      - uses: actions/cache@v4
        id: toolchain
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: ${{ runner.os }}-${{ runner.arch }}-threads-toolchain-1.98.1-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          targets: wasm32-wasip1-threads
          components: rustfmt
      - name: Build the real fixture twice and verify receipts and tamper failures
        run: bun test ./packages/waffle/scripts/threads-fixture-producer.test.ts --timeout 120000
        env:
          THREAD_FIXTURE_TEST_ROOT: ${{ runner.temp }}
          THREAD_FIXTURE_EXPORT_DIR: ${{ runner.temp }}/threads-fixture
      - uses: actions/upload-artifact@v4
        id: fixture
        with:
          name: threads-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/threads-fixture
          if-no-files-found: error
      - run: rustfmt +1.98.1 --check packages/waffle/tests/fixtures/threads.rs
      - name: Report the compiler cache result
        if: always()
        run: echo "threads toolchain cache-hit=${{ steps.toolchain.outputs.cache-hit }}"
      - uses: ./.github/actions/save-release-downloads
        if: always() && env.CI_RELEASE_CACHE_INITIAL != ''
