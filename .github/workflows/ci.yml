              - "packages/coreutils/scripts/programs.ts"
              - "packages/coreutils/tests/checksums-wasi.test.ts"
              - "packages/coreutils/tests/helpers/checksum-regressions.ts"
              - "packages/coreutils/fixtures/checksums.json"
              - "packages/coreutils/provenance/checksums.source.json"
            sed:
              - "tools/program-locales/**"
              - ".github/workflows/ci.yml"
              - ".github/actions/release-downloads/**"
              - ".github/actions/save-release-downloads/**"
              - ".github/actions/setup-tools/**"
              - "tools/ci-*.ts"
              - "packages/waffle/**"
              - "packages/sed/**"
            findutils:
              - ".github/workflows/ci.yml"
              - ".github/actions/release-downloads/**"
              - ".github/actions/save-release-downloads/**"
              - ".github/actions/setup-tools/**"
              - "tools/ci-*.ts"
              - ".github/workflows/findutils-xargs.yml"
              - ".github/actions/program-optimizer/action.yml"
              - "packages/waffle/**"
              - "packages/findutils/**"
              - "package.json"
              - "bun.lock"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "packages/process-consumer/**"
              - "packages/program-support/**"
              - "tools/program-build-tools.ts"
              - "tools/program-optimize.ts"
              - "tools/program-derivation.ts"
              - "tools/program-symbols.ts"
              - "tools/program-locales/**"
              - "tools/family-acceptance.ts"
              - "tools/tsconfig.programs.json"
