name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.4"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      libc: ${{ steps.paths.outputs.libc }}
      browser: ${{ steps.paths.outputs.browser }}
      network: ${{ steps.paths.outputs.network }}
      coreutils: ${{ steps.paths.outputs.coreutils }}
      sed: ${{ steps.paths.outputs.sed }}
      findutils: ${{ steps.paths.outputs.findutils }}
      grep: ${{ steps.paths.outputs.grep }}
      ripgrep: ${{ steps.paths.outputs.ripgrep }}
      base: ${{ steps.paths.outputs.base }}
      programs: ${{ steps.paths.outputs.programs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          base: ${{ github.ref }}
          filters: |
            network:
              - ".github/**"
              - "packages/waffle/Cargo.toml"
              - "packages/waffle/Cargo.lock"
              - "packages/waffle/rust-toolchain.toml"
              - "packages/waffle/network/**"
              - "packages/waffle/tooling/build-network.ts"
              - "packages/waffle/tooling/check-network-rust.ts"
              - "packages/waffle/build.ts"
              - "packages/waffle/prepare.ts"
              - "packages/waffle/tooling/network-size.ts"
              - "packages/waffle/browser/net/module.ts"
              - "packages/waffle/browser/net/namespace.ts"
              - "packages/waffle/tests/network-module.test.ts"
              - "packages/waffle/tests/network-module-host.test.ts"
              - "packages/waffle/tests/network-wire.test.ts"
              - "packages/waffle/tests/network-size.test.ts"
              - "packages/waffle/tests/network-lazy.test.ts"
              - "packages/waffle/tests/packaging.test.ts"
              - "packages/waffle/tests/git-install.test.ts"
              - "packages/waffle/tests/node-exports.test.ts"
              - "packages/waffle/tests/runtime-size.test.ts"
            coreutils:
              - ".github/**"
              - "packages/waffle/**"
              - "packages/coreutils/**"
            sed:
              - ".github/**"
              - "packages/waffle/**"
              - "packages/sed/**"
            findutils:
              - ".github/**"
              - "packages/waffle/**"
              - "packages/findutils/**"
            grep:
              - ".github/**"
              - "packages/waffle/**"
              - "packages/grep/**"
            ripgrep:
              - ".github/**"
              - "packages/waffle/**"
              - "packages/ripgrep/**"
            base:
              - ".github/**"
              - "packages/waffle/**"
              - "packages/base/**"
            programs:
              - ".github/**"
              - "package.json"
              - "bun.lock"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "tools/**"
              - "scripts/**"
              - "packages/waffle/**"
              - "packages/program-support/**"
              - "packages/process-consumer/**"
              - "packages/coreutils/**"
              - "packages/grep/**"
              - "packages/findutils/**"
              - "packages/sed/**"
              - "packages/ripgrep/**"
              - "packages/base/**"
              - "packages/python/**"
              - "packages/git/**"
            browser:
              - ".github/**"
              - "packages/waffle/Cargo.toml"
              - "packages/waffle/Cargo.lock"
              - "packages/waffle/rust-toolchain.toml"
              - "packages/waffle/network/**"
              - "packages/waffle/tooling/build-network.ts"
              - "packages/waffle/tooling/check-network-rust.ts"
              - "packages/waffle/build.ts"
              - "packages/waffle/prepare.ts"
              - "packages/waffle/core/**"
              - "packages/waffle/fs/**"
              - "packages/waffle/proc/**"
              - "packages/waffle/interrupt/**"
              - "packages/waffle/browser/**"
              - "packages/waffle/runtime.ts"
              - "packages/waffle/index.ts"
              - "package.json"
              - "packages/waffle/package.json"
              - "bun.lock"
              - "packages/waffle/scripts/test-browser.ts"
              - "packages/waffle/scripts/browser-command.ts"
              - "packages/waffle/scripts/browser-supervisor.ts"
              - "packages/waffle/scripts/owned-command.ts"
              - "packages/waffle/tests/**"
            libc:
              - '.github/**'
              - 'packages/waffle/patches/**'
              - 'packages/waffle/scripts/build-wasi-libc.sh'
              - 'packages/waffle/scripts/test-wasi-libc.ts'
              - 'packages/waffle/scripts/owned-command.ts'
              - 'packages/waffle/core/**'
              - 'packages/waffle/fs/**'
              - 'packages/waffle/proc/**'
              - 'packages/waffle/interrupt/**'
              - 'packages/waffle/browser/**'
              - 'packages/waffle/runtime.ts'
              - 'packages/waffle/index.ts'
              - 'package.json'
              - 'packages/waffle/package.json'
              - 'bun.lock'
              - 'packages/waffle/tests/wasi-libc.test.ts'
              - 'packages/waffle/tests/fixtures/**'
  network-wasm:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/packages/waffle/target
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        id: network-artifact
        with:
          path: |
            packages/waffle/browser/net/network.wasm
            packages/waffle/browser/net/network.input-hash
            packages/waffle/browser/net/network.sha256
          key: network-wasm-v1-${{ hashFiles('packages/waffle/Cargo.toml', 'packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml', 'packages/waffle/network/Cargo.toml', 'packages/waffle/network/src/**', 'packages/waffle/tooling/build-network.ts') }}
      - name: Cache Rust toolchain and Cargo build inputs
        if: steps.network-artifact.outputs.cache-hit != 'true' || needs.changes.outputs.network == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        id: rust-cache
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            packages/waffle/target
          key: ${{ runner.os }}-${{ runner.arch }}-network-rust-${{ hashFiles('packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml') }}-${{ hashFiles('packages/waffle/network/**/*.rs') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-network-rust-${{ hashFiles('packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml') }}-
      - uses: dtolnay/rust-toolchain@stable
        if: steps.network-artifact.outputs.cache-hit != 'true' || needs.changes.outputs.network == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch'
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - name: Build exact-input network artifact once
        if: steps.network-artifact.outputs.cache-hit != 'true'
        run: bun run --cwd packages/waffle build:network
      - name: Rust native, state and actual WASM tests
        if: steps.network-artifact.outputs.cache-hit != 'true' || needs.changes.outputs.network == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch'
        run: |
          bun tooling/check-network-rust.ts
          cargo fmt --all -- --check
          cargo clippy --release --all-targets --features module-tests --locked -- -D warnings
          cargo test --release -p waffle-tcp --features module-tests --locked -- --nocapture
        working-directory: packages/waffle
        env:
          WAFFLE_TCP_MODULE: ${{ github.workspace }}/packages/waffle/browser/net/network.wasm
      - name: Report exact artifact and Rust cache hits
        run: |
          echo "network artifact cache-hit=${{ steps.network-artifact.outputs.cache-hit }}"
          echo "Rust cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
  package:
    env:
      WAFFLE_NETWORK_PREBUILT: "1"
    needs: network-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache/restore@v4
        id: network-artifact
        with:
          path: |
            packages/waffle/browser/net/network.wasm
            packages/waffle/browser/net/network.input-hash
            packages/waffle/browser/net/network.sha256
          key: network-wasm-v1-${{ hashFiles('packages/waffle/Cargo.toml', 'packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml', 'packages/waffle/network/Cargo.toml', 'packages/waffle/network/src/**', 'packages/waffle/tooling/build-network.ts') }}
          fail-on-cache-miss: true
      - name: Verify exact-input network artifact before installation
        run: bun run --cwd packages/waffle tooling/build-network.ts --verify
      - name: Cache Bun package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-pm-v2-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun install --cwd site --frozen-lockfile
      - run: bun run quality
      - run: bun run test && bun run test:ci
      - run: bun run size && bun run size:network
      - run: bun run pack
      - uses: actions/upload-artifact@v4
        with:
          name: waffle-runtime-tarball-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/waffle/dist/*.tgz
          if-no-files-found: error
          retention-days: 7
      - run: bun run pack:check
        env:
          TMPDIR: ${{ runner.temp }}
      - run: test -z "$(git ls-files packages/waffle/dist)"
  libc:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.libc == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        id: wasmtime
        with:
          path: ~/downloader/bin/wasmtime
          key: ${{ runner.os }}-wasmtime-49.0.3
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        if: steps.wasmtime.outputs.cache-hit != 'true'
        with:
          version: 49.0.3
      - name: Add cached Wasmtime to PATH
        run: |
          echo "$HOME/downloader/bin" >> "$GITHUB_PATH"
          "$HOME/downloader/bin/wasmtime" --version
      - uses: actions/cache@v4
        id: fixtures
        with:
          path: ${{ runner.temp }}/libc-fixtures
          key: ${{ runner.os }}-libc-sdk34-bun${{ env.BUN_VERSION }}-${{ hashFiles('packages/waffle/scripts/build-wasi-libc.sh', 'packages/waffle/scripts/test-wasi-libc.ts', 'packages/waffle/scripts/owned-command.ts', 'packages/waffle/patches/wasi-libc/**', 'packages/waffle/tests/fixtures/preopen-guest.c', 'packages/waffle/tests/fixtures/wasm-start-section.ts') }}
      - uses: actions/cache@v4
        if: steps.fixtures.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/libc-sysroot
          key: ${{ runner.os }}-libc-sysroot-sdk34-${{ hashFiles('packages/waffle/scripts/build-wasi-libc.sh', 'packages/waffle/patches/wasi-libc/**') }}
      - uses: actions/cache@v4
        if: steps.fixtures.outputs.cache-hit != 'true'
        id: sdk
        with:
          path: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          key: ${{ runner.os }}-wasi-sdk-34-b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
      - name: Install pinned wasi-sdk 34
        if: steps.fixtures.outputs.cache-hit != 'true' && steps.sdk.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz -o wasi-sdk.tar.gz
          echo 'b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  wasi-sdk.tar.gz' | sha256sum -c -
          tar -xzf wasi-sdk.tar.gz
          rm wasi-sdk.tar.gz
      - run: bun run test:libc
        env:
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          WASI_LIBC_SCRATCH_ROOT: ${{ runner.temp }}
          WASMTIME: wasmtime
          WASI_LIBC_FIXTURE_CACHE: ${{ runner.temp }}/libc-fixtures
          WASI_LIBC_SYSROOT_CACHE: ${{ runner.temp }}/libc-sysroot
  browser:
    env:
      WAFFLE_NETWORK_PREBUILT: "1"
    needs: [changes, network-wasm]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.browser == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache/restore@v4
        id: network-artifact
        with:
          path: |
            packages/waffle/browser/net/network.wasm
            packages/waffle/browser/net/network.input-hash
            packages/waffle/browser/net/network.sha256
          key: network-wasm-v1-${{ hashFiles('packages/waffle/Cargo.toml', 'packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml', 'packages/waffle/network/Cargo.toml', 'packages/waffle/network/src/**', 'packages/waffle/tooling/build-network.ts') }}
          fail-on-cache-miss: true
      - name: Verify exact-input network artifact before installation
        run: bun run --cwd packages/waffle tooling/build-network.ts --verify
      - name: Restore Bun package downloads
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-pm-v2-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - name: Use Ubuntu HTTPS archives for browser dependencies
        run: |
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          test -s /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test:browser 2>&1 | tee "$RUNNER_TEMP/waffle-browser-protocol.log"
        shell: bash
        env:
          RECOVERY_R42_REPORT: ${{ runner.temp }}/recovery-r42-report.json
          STORAGE_SCRATCH_ROOT: ${{ runner.temp }}
          PROCESS_SCRATCH_ROOT: ${{ runner.temp }}
      - run: bun packages/waffle/tests/publication-browser-runner.ts --workspace chromium
        env:
          STORAGE_SCRATCH_ROOT: ${{ runner.temp }}
      - name: Retain recovery failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-recovery-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-r42-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain browser failure protocol
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-protocol-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/waffle-browser-protocol.log
          retention-days: 7
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Restore Bun package downloads
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-pm-v2-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build
  programs:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.programs == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-wasip1
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-programs-${{ hashFiles('bun.lock', 'Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('packages/**/*.rs', 'tools/program-build-tools.ts') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-programs-${{ hashFiles('bun.lock', 'Cargo.lock', 'rust-toolchain.toml') }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run programs:check
      - run: bun run --cwd packages/waffle tsc -p ../../scripts/tsconfig.json
      - run: bun run programs:tools
      - run: bun test scripts/program-release.test.ts
      - run: bun run programs:routes
      - run: bun run programs:source
      - run: bun run --cwd packages/python test:composition
      - run: bun run --cwd packages/python test:build
      - run: bun run --cwd packages/python test:unit
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p waffle-program-support -p waffle-process-consumer -p waffle-coreutils -p waffle-clear -p waffle-cut -p waffle-tr -p waffle-wc -p waffle-grep -p waffle-findutils-source
