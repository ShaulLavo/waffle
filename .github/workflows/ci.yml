  network-wasm:
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!cancelled()) }}
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/packages/waffle/target
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        id: network-artifact
        with:
          path: |
            packages/waffle/browser/net/network.wasm
            packages/waffle/browser/net/network.input-hash
            packages/waffle/browser/net/network.sha256
          key: network-wasm-v1-${{ hashFiles('packages/waffle/Cargo.toml', 'packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml', 'packages/waffle/network/Cargo.toml', 'packages/waffle/network/src/**', 'packages/waffle/tooling/build-network.ts') }}
      - name: Cache Rust toolchain and Cargo build inputs
        if: steps.network-artifact.outputs.cache-hit != 'true' || needs.changes.outputs.network == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        id: rust-cache
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            packages/waffle/target
          key: ${{ runner.os }}-${{ runner.arch }}-network-rust-${{ hashFiles('packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml') }}-${{ hashFiles('packages/waffle/network/**/*.rs') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-network-rust-${{ hashFiles('packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml') }}-
      - uses: dtolnay/rust-toolchain@stable
        if: steps.network-artifact.outputs.cache-hit != 'true' || needs.changes.outputs.network == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch'
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - name: Build exact-input network artifact once
        if: steps.network-artifact.outputs.cache-hit != 'true'
        run: bun run --cwd packages/waffle build:network
      - name: Rust native, state and actual WASM tests
        if: steps.network-artifact.outputs.cache-hit != 'true' || needs.changes.outputs.network == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch'
        run: |
          bun tooling/check-network-rust.ts
          cargo fmt --all -- --check
          cargo clippy --release --all-targets --features module-tests --locked -- -D warnings
          cargo test --release -p waffle-tcp --features module-tests --locked -- --nocapture
        working-directory: packages/waffle
        env:
          WAFFLE_TCP_MODULE: ${{ github.workspace }}/packages/waffle/browser/net/network.wasm
      - name: Report exact artifact and Rust cache hits
        run: |
          echo "network artifact cache-hit=${{ steps.network-artifact.outputs.cache-hit }}"
          echo "Rust cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
      - uses: ./.github/actions/save-release-downloads
        if: always() && env.CI_RELEASE_CACHE_INITIAL != ''
  awk:
    env:
      WAFFLE_NETWORK_PREBUILT: "1"
    needs: [changes, network-wasm]
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.awk == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: "24"
      - uses: actions/cache/restore@v4
        id: network-artifact
        with:
          path: |
            packages/waffle/browser/net/network.wasm
            packages/waffle/browser/net/network.input-hash
            packages/waffle/browser/net/network.sha256
          key: network-wasm-v1-${{ hashFiles('packages/waffle/Cargo.toml', 'packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml', 'packages/waffle/network/Cargo.toml', 'packages/waffle/network/src/**', 'packages/waffle/tooling/build-network.ts') }}
          fail-on-cache-miss: true
      - name: Verify exact-input network artifact before installation
        run: bun run --cwd packages/waffle tooling/build-network.ts --verify
      - uses: actions/cache/restore@v4
        id: bun-cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-pm-v2-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
      - uses: actions/cache@v4
        id: sdk
        with:
          path: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          key: ${{ runner.os }}-wasi-sdk-34-b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
      - name: Install pinned wasi-sdk 34
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/tools/ci-release-download.ts" https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz wasi-sdk.tar.gz 120000
          echo 'b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  wasi-sdk.tar.gz' | sha256sum -c -
          tar -xzf wasi-sdk.tar.gz
          rm wasi-sdk.tar.gz
      - uses: actions/cache@v4
        id: libc-cache
        with:
          path: .build/wasi-libc
          key: ${{ runner.os }}-${{ runner.arch }}-awk-libc-${{ hashFiles('tools/program-build-tools.ts', 'packages/waffle/scripts/build-wasi-libc.sh', 'packages/waffle/patches/wasi-libc/**') }}
      - uses: actions/cache@v4
        id: wasmtime
        with:
          path: ~/downloader/bin/wasmtime
          key: ${{ runner.os }}-wasmtime-49.0.3
      - uses: ./.github/actions/setup-wasmtime
        if: steps.wasmtime.outputs.cache-hit != 'true'
      - run: echo "$HOME/downloader/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bison ninja-build
      - uses: ./.github/actions/program-optimizer
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run prepare:package
      - name: Build and qualify only awk
        run: bun run programs:awk
        env:
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          WASI_LIBC_SCRATCH_ROOT: ${{ runner.temp }}
          AWK_SCRATCH_ROOT: ${{ runner.temp }}
      - name: Report awk dependency cache hits
        if: always()
