name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITHUB_TOKEN: ${{ github.token }}
  BUN_VERSION: "1.4.4"

jobs:
  core:
    name: Core and programs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: paths
        continue-on-error: true
        with:
          base: ${{ github.ref }}
          filters: |
            network:
              - ".github/workflows/ci.yml"
              - ".github/actions/release-downloads/**"
              - ".github/actions/save-release-downloads/**"
              - ".github/actions/setup-tools/**"
              - "tools/ci-*.ts"
              - "packages/waffle/Cargo.toml"
              - "packages/waffle/Cargo.lock"
              - "packages/waffle/rust-toolchain.toml"
              - "packages/waffle/network/**"
              - "packages/waffle/tooling/build-network.ts"
              - "packages/waffle/tooling/network-translator.ts"
              - "packages/waffle/tooling/network-translator.test.ts"
              - "packages/waffle/tooling/network-source-smoke.ts"
              - "packages/waffle/tooling/network-translator/**"
              - "packages/waffle/tooling/network-growth.ts"
              - "packages/waffle/tooling/check-network-rust.ts"
              - "packages/waffle/build.ts"
              - "packages/waffle/prepare.ts"
              - "packages/waffle/tooling/network-size.ts"
              - "packages/waffle/browser/net/module.ts"
              - "packages/waffle/browser/net/namespace.ts"
              - "packages/waffle/tests/network-module.test.ts"
              - "packages/waffle/tests/network-module-host.test.ts"
              - "packages/waffle/tests/network-wire.test.ts"
              - "packages/waffle/tests/network-size.test.ts"
              - "packages/waffle/tests/network-lazy.test.ts"
              - "packages/waffle/tests/packaging.test.ts"
              - "packages/waffle/tests/git-install.test.ts"
              - "packages/waffle/tests/node-exports.test.ts"
              - "packages/waffle/tests/runtime-size.test.ts"
            coreutils:
              - ".github/workflows/ci.yml"
              - ".github/actions/release-downloads/**"
              - ".github/actions/save-release-downloads/**"
              - ".github/actions/setup-tools/**"
              - "tools/ci-*.ts"
              - ".github/workflows/findutils-xargs.yml"
              - ".github/workflows/coreutils-echo.yml"
              - ".github/actions/program-optimizer/action.yml"
              - "packages/waffle/**"
              - "packages/coreutils/**"
              - "package.json"
              - "bun.lock"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "packages/program-support/**"
              - "packages/process-consumer/**"
              - "packages/findutils/**"
              - "tools/program-build-tools.ts"
              - "tools/program-optimize.ts"
              - "tools/program-derivation.ts"
              - "tools/program-symbols.ts"
