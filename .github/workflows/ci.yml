    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.checksums == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: "24"
      - uses: actions/cache/restore@v4
        id: network-artifact
        with:
          path: |
            packages/waffle/browser/net/network.wasm
            packages/waffle/browser/net/network.input-hash
            packages/waffle/browser/net/network.sha256
          key: network-wasm-v1-${{ hashFiles('packages/waffle/Cargo.toml', 'packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml', 'packages/waffle/network/Cargo.toml', 'packages/waffle/network/src/**', 'packages/waffle/tooling/build-network.ts') }}
          fail-on-cache-miss: true
      - name: Verify exact-input network artifact before installation
        run: bun run --cwd packages/waffle tooling/build-network.ts --verify
      - uses: actions/cache@v4
        id: bun-cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-pm-v2-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
      - uses: actions/cache@v4
        id: sdk
        with:
          path: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          key: ${{ runner.os }}-wasi-sdk-34-b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
      - name: Install pinned wasi-sdk 34
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/tools/ci-release-download.ts" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz wasi-sdk.tar.gz 300000
          printf '%s  %s\n' b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4 wasi-sdk.tar.gz | sha256sum --check --status
          tar -xzf wasi-sdk.tar.gz
          rm wasi-sdk.tar.gz
      - uses: actions/cache@v4
        id: checksum-cache
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            .build/coreutils-checksums
            .build/program-locales
            .build/wasi-libc
            packages/coreutils/.sources
          key: ${{ runner.os }}-${{ runner.arch }}-program-coreutils-checksums-v1-${{ hashFiles('bun.lock', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'packages/coreutils/crates/checksums/Cargo.toml', 'packages/coreutils/crates/checksums/Cargo.lock', 'packages/coreutils/crates/checksums/**/*.rs', 'packages/coreutils/crates/checksums/patches/**', 'packages/coreutils/scripts/build-checksums.ts', 'packages/coreutils/scripts/build-config.ts', 'packages/coreutils/scripts/build-family.ts', 'packages/coreutils/scripts/checksum-artifact.ts', 'packages/coreutils/scripts/prepare-checksum-source.ts', 'packages/coreutils/scripts/programs.ts', 'tools/program-build-tools.ts', 'tools/program-optimize.ts', 'tools/program-derivation.ts', 'tools/program-locales/**', 'packages/waffle/scripts/build-wasi-libc.sh', 'packages/waffle/patches/wasi-libc/**') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-program-coreutils-checksums-v1-
      - name: Discard a generated source restored from a different checksum recipe
        if: steps.checksum-cache.outputs.cache-hit != 'true'
        run: rm -rf packages/coreutils/.sources/checksums
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-wasip1
      - name: Fetch locked Cargo sources before checksum source preparation
        run: cargo fetch --locked
      - uses: ./.github/actions/program-optimizer
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run prepare:package
      - name: Identify the pinned GNU checksum source and native toolchain
        id: checksum-oracle-identity
        run: |
          set -euo pipefail
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "key=$(node packages/coreutils/scripts/build-native-checksum-oracle.ts --identity)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: checksum-native-oracle
        with:
          path: .build/gnu-checksum-native-oracle
          key: ${{ runner.os }}-${{ runner.arch }}-gnu-checksum-native-v1-${{ steps.checksum-oracle-identity.outputs.image }}-${{ steps.checksum-oracle-identity.outputs.key }}
      - name: Build the nine native GNU oracle programs on cache miss
        if: steps.checksum-native-oracle.outputs.cache-hit != 'true'
        run: node packages/coreutils/scripts/build-native-checksum-oracle.ts
        env:
          GNU_CHECKSUM_ORACLE_SCRATCH_ROOT: ${{ runner.temp }}
      - name: Verify the pinned GNU 9.12 checksum oracle
        run: node packages/coreutils/scripts/build-native-checksum-oracle.ts --verify-only
      - name: Build the nine checksum guests once through the existing leaf route
        run: bun run --cwd packages/coreutils build:checksums
        env:
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          WASI_LIBC_SCRATCH_ROOT: ${{ runner.temp }}
      - name: Read back the exact admitted checksum guests
        run: node packages/coreutils/scripts/checksum-artifact.ts "$GITHUB_WORKSPACE/.build/checksum-artifact"
        env:
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
      - name: Run checksum runtime acceptance against the admitted bytes
        run: bun run --cwd packages/coreutils test:checksums:wasi
        env:
          CHECKSUM_ARTIFACTS: ${{ github.workspace }}/.build/checksum-artifact
      - name: Retain the exact checksum-only producer closure
        uses: actions/upload-artifact@v4
        with:
          name: checksum-producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/checksum-artifact
            .build/gnu-checksum-native-oracle/metadata.json
          if-no-files-found: error
          retention-days: 7
      - name: Report checksum dependency cache hits
        if: always()
        run: |
          echo "network=${{ steps.network-artifact.outputs.cache-hit }}"
          echo "Bun=${{ steps.bun-cache.outputs.cache-hit }}"
          echo "SDK=${{ steps.sdk.outputs.cache-hit }}"
          echo "Cargo/sysroot/locale=${{ steps.checksum-cache.outputs.cache-hit }}"
          echo "GNU oracle=${{ steps.checksum-native-oracle.outputs.cache-hit }}"
      - uses: ./.github/actions/save-release-downloads
        if: always() && env.CI_RELEASE_CACHE_INITIAL != ''
  programs:
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.programs == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-wasip1
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-programs-${{ hashFiles('bun.lock', 'Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('packages/**/*.rs', 'tools/program-build-tools.ts', 'tools/program-optimize.ts', 'tools/program-derivation.ts', 'tools/program-locales/**') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-programs-${{ hashFiles('bun.lock', 'Cargo.lock', 'rust-toolchain.toml') }}-
      - uses: ./.github/actions/rust-build-cache
      - run: cargo fetch --locked
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run programs:check
      - run: bun run --cwd packages/git test:unit
      - run: bun run --cwd packages/waffle tsc -p ../../scripts/tsconfig.json
      - uses: ./.github/actions/program-optimizer
      - run: bun run programs:tools
      - run: bun test scripts/program-release.test.ts scripts/program-rebind.test.ts scripts/host-interface.test.ts
      - run: bun run programs:routes
      - run: bun run programs:source
      - uses: ./.github/actions/setup-tools
        if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.coreutils == 'true' }}
        with:
          bun-version: "1.4.4"
          node-version: "26.12.1"
      - name: Record exact GNU date source and native compiler identity
        if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.coreutils == 'true' }}
        id: gnu-date-identity
        run: |
          set -euo pipefail
          identity=$(node packages/coreutils/scripts/build-native-date-oracle.ts --identity)
          printf 'identity=%s\n' "$identity" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.coreutils == 'true' }}
        id: gnu-date-native
        with:
          path: .build/gnu-date-native-oracle
          key: ${{ runner.os }}-${{ runner.arch }}-gnu-date-9.12-v1-${{ steps.gnu-date-identity.outputs.identity }}
      - name: Build or verify only the pinned GNU date native oracle
        if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.coreutils == 'true' }}
        env:
          GNU_DATE_ORACLE_ROOT: ${{ github.workspace }}/.build/gnu-date-native-oracle
          GNU_DATE_ORACLE_SCRATCH_ROOT: ${{ runner.temp }}
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE" "$GNU_DATE_ORACLE_SCRATCH_ROOT"
          bash packages/coreutils/scripts/provision-native-date.sh
          node packages/coreutils/scripts/build-native-date-oracle.ts --verify-only
          printf 'GNU_DATE=%s/date\n' "$GNU_DATE_ORACLE_ROOT" >> "$GITHUB_ENV"
          printf 'GNU_DATE_ORACLE_ROOT=%s\n' "$GNU_DATE_ORACLE_ROOT" >> "$GITHUB_ENV"
      - name: Verify date source against the pinned native GNU oracle
        if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.coreutils == 'true' }}
        run: node --disable-warning=ExperimentalWarning --test packages/coreutils/scripts/date-source.test.ts
      - run: bun run --cwd packages/python test:composition
      - run: bun run --cwd packages/python test:build
      - run: bun run --cwd packages/python test:unit
      - run: cargo fmt --all -- --check
      - run: bash scripts/with-build-cache.sh cargo test --locked -p waffle-program-support -p waffle-process-consumer -p waffle-coreutils -p waffle-clear -p waffle-cut -p waffle-tr -p waffle-wc -p waffle-grep -p waffle-findutils-source -p upstream-xargs -p waffle-echo -p waffle-date

      - uses: ./.github/actions/save-release-downloads
        if: always() && env.CI_RELEASE_CACHE_INITIAL != ''
  gate:
    name: Complete CI gate
    if: always()
    needs:
      [
        changes,
        network-wasm,
        awk,
        procps,
        diffutils,
        gh,
        jq,
        curl,
        tar,
        package,
        libc,
        browser,
        site,
        findutils-xargs,
        coreutils-echo,
        coreutils-checksums,
        programs,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require a ready PR
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo '::error::Mark this PR ready for review to run the required checks.'
          exit 1
      - name: Reject failed or cancelled CI jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
