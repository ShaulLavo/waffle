name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.4"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      libc: ${{ steps.paths.outputs.libc }}
      browser: ${{ steps.paths.outputs.browser }}
      network: ${{ steps.paths.outputs.network }}
      coreutils: ${{ steps.paths.outputs.coreutils }}
      sed: ${{ steps.paths.outputs.sed }}
      findutils: ${{ steps.paths.outputs.findutils }}
      grep: ${{ steps.paths.outputs.grep }}
      ripgrep: ${{ steps.paths.outputs.ripgrep }}
      base: ${{ steps.paths.outputs.base }}
      programs: ${{ steps.paths.outputs.programs }}
      diffutils: ${{ steps.paths.outputs.diffutils }}
      gh: ${{ steps.paths.outputs.gh }}
      jq: ${{ steps.paths.outputs.jq }}
      tar: ${{ steps.paths.outputs.tar }}
      procps-pure: ${{ steps.paths.outputs.procps-pure }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          base: ${{ github.ref }}
          filters: |
            network:
              - ".github/**"
              - "packages/waffle/Cargo.toml"
              - "packages/waffle/Cargo.lock"
              - "packages/waffle/rust-toolchain.toml"
              - "packages/waffle/network/**"
              - "packages/waffle/tooling/build-network.ts"
              - "packages/waffle/tooling/check-network-rust.ts"
              - "packages/waffle/build.ts"
              - "packages/waffle/prepare.ts"
              - "packages/waffle/tooling/network-size.ts"
              - "packages/waffle/browser/net/module.ts"
              - "packages/waffle/browser/net/namespace.ts"
              - "packages/waffle/tests/network-module.test.ts"
              - "packages/waffle/tests/network-module-host.test.ts"
              - "packages/waffle/tests/network-wire.test.ts"
              - "packages/waffle/tests/network-size.test.ts"
              - "packages/waffle/tests/network-lazy.test.ts"
              - "packages/waffle/tests/packaging.test.ts"
              - "packages/waffle/tests/git-install.test.ts"
              - "packages/waffle/tests/node-exports.test.ts"
              - "packages/waffle/tests/runtime-size.test.ts"
            coreutils:
              - ".github/**"
              - "packages/waffle/**"
              - "packages/coreutils/**"
              - "package.json"
              - "bun.lock"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "packages/program-support/**"
              - "packages/process-consumer/**"
              - "packages/findutils/**"
              - "tools/program-build-tools.ts"
              - "tools/program-optimize.ts"
              - "tools/program-derivation.ts"
              - "tools/program-locales/**"
              - "tools/family-acceptance.ts"
              - "tools/tsconfig.programs.json"
              - "packages/grep/tests/fixtures/grep-usage-cases.json"
              - "packages/ripgrep/tests/helpers/rg-fixtures.ts"
            sed:
              - "tools/program-locales/**"
              - ".github/**"
              - "packages/waffle/**"
              - "packages/sed/**"
            findutils:
              - ".github/**"
              - "packages/waffle/**"
              - "packages/findutils/**"
              - "package.json"
              - "bun.lock"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "packages/process-consumer/**"
              - "packages/program-support/**"
              - "tools/program-build-tools.ts"
              - "tools/program-optimize.ts"
              - "tools/program-derivation.ts"
              - "tools/program-locales/**"
              - "tools/family-acceptance.ts"
              - "tools/tsconfig.programs.json"
              - "packages/coreutils/fixtures/cut-tr.json"
              - "packages/grep/tests/fixtures/grep-usage-cases.json"
              - "packages/ripgrep/tests/helpers/rg-fixtures.ts"
            grep:
              - ".github/**"
              - "packages/waffle/**"
              - "packages/grep/**"
            ripgrep:
              - ".github/**"
              - "packages/waffle/**"
              - "packages/ripgrep/**"
            base:
              - ".github/**"
              - "packages/waffle/**"
              - "packages/base/**"
            programs:
              - ".github/**"
              - "package.json"
              - "bun.lock"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "tools/**"
              - "scripts/**"
              - "packages/waffle/**"
              - "packages/program-support/**"
              - "packages/process-consumer/**"
              - "packages/coreutils/**"
              - "packages/grep/**"
              - "packages/findutils/**"
              - "packages/sed/**"
              - "packages/ripgrep/**"
              - "packages/base/**"
              - "packages/python/**"
              - "packages/git/**"
              - "packages/tar/**"
            diffutils:
              - ".github/**"
              - "package.json"
              - "bun.lock"
              - "tools/program-build-tools.ts"
              - "tools/program-optimize.ts"
              - "tools/program-derivation.ts"
              - "tools/program-package.ts"
              - "tools/family-acceptance.ts"
              - "tools/tsconfig.programs.json"
              - "packages/waffle/**"
              - "packages/base/**"
              - "packages/diffutils/**"
            gh:
              - ".github/**"
              - "package.json"
              - "bun.lock"
              - "tools/program-package.ts"
              - "tools/tsconfig.programs.json"
              - "packages/waffle/**"
              - "packages/gh/**"
            jq:
              - ".github/**"
              - "package.json"
              - "bun.lock"
              - "rust-toolchain.toml"
              - "tools/program-build-tools.ts"
              - "tools/program-optimize.ts"
              - "tools/program-derivation.ts"
              - "tools/program-package.ts"
              - "tools/family-acceptance.ts"
              - "tools/tsconfig.programs.json"
              - "packages/waffle/**"
              - "packages/base/**"
              - "packages/jq/**"
            tar:
              - ".github/**"
              - "package.json"
              - "bun.lock"
              - "rust-toolchain.toml"
              - "tools/program-build-tools.ts"
              - "tools/program-optimize.ts"
              - "tools/program-derivation.ts"
              - "tools/program-package.ts"
              - "tools/family-acceptance.ts"
              - "tools/tsconfig.programs.json"
              - "packages/waffle/**"
              - "packages/base/**"
              - "packages/tar/**"
            procps-pure:
              - ".github/workflows/ci.yml"
              - "package.json"
              - "bun.lock"
              - "packages/waffle/**"
              - "packages/procps/**"
            browser:
              - ".github/**"
              - "packages/waffle/Cargo.toml"
              - "packages/waffle/Cargo.lock"
              - "packages/waffle/rust-toolchain.toml"
              - "packages/waffle/network/**"
              - "packages/waffle/tooling/build-network.ts"
              - "packages/waffle/tooling/check-network-rust.ts"
              - "packages/waffle/build.ts"
              - "packages/waffle/prepare.ts"
              - "packages/waffle/core/**"
              - "packages/waffle/fs/**"
              - "packages/waffle/proc/**"
              - "packages/waffle/interrupt/**"
              - "packages/waffle/browser/**"
              - "packages/waffle/search/**"
              - "packages/waffle/group/**"
              - "packages/waffle/link/**"
              - "packages/waffle/runtime.ts"
              - "packages/waffle/index.ts"
              - "package.json"
              - "packages/waffle/package.json"
              - "bun.lock"
              - "packages/waffle/scripts/build-memory-group-fixture.ts"
              - "packages/waffle/scripts/test-browser.ts"
              - "packages/waffle/scripts/browser-command.ts"
              - "packages/waffle/scripts/browser-supervisor.ts"
              - "packages/waffle/scripts/owned-command.ts"
              - "packages/waffle/tests/**"
            libc:
              - '.github/**'
              - 'packages/waffle/patches/**'
              - 'packages/waffle/scripts/build-wasi-libc.sh'
              - 'packages/waffle/scripts/test-wasi-libc.ts'
              - 'packages/waffle/scripts/owned-command.ts'
              - 'packages/waffle/core/**'
              - 'packages/waffle/fs/**'
              - 'packages/waffle/proc/**'
              - 'packages/waffle/interrupt/**'
              - 'packages/waffle/browser/**'
              - 'packages/waffle/runtime.ts'
              - 'packages/waffle/index.ts'
              - 'package.json'
              - 'packages/waffle/package.json'
              - 'bun.lock'
              - 'packages/waffle/tests/wasi-libc.test.ts'
              - 'packages/waffle/tests/fixtures/**'
              - 'packages/waffle/scripts/build-memory-group-fixture.ts'
  network-wasm:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/packages/waffle/target
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        id: network-artifact
        with:
          path: |
            packages/waffle/browser/net/network.wasm
            packages/waffle/browser/net/network.input-hash
            packages/waffle/browser/net/network.sha256
          key: network-wasm-v1-${{ hashFiles('packages/waffle/Cargo.toml', 'packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml', 'packages/waffle/network/Cargo.toml', 'packages/waffle/network/src/**', 'packages/waffle/tooling/build-network.ts') }}
      - name: Cache Rust toolchain and Cargo build inputs
        if: steps.network-artifact.outputs.cache-hit != 'true' || needs.changes.outputs.network == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        id: rust-cache
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            packages/waffle/target
          key: ${{ runner.os }}-${{ runner.arch }}-network-rust-${{ hashFiles('packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml') }}-${{ hashFiles('packages/waffle/network/**/*.rs') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-network-rust-${{ hashFiles('packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml') }}-
      - uses: dtolnay/rust-toolchain@stable
        if: steps.network-artifact.outputs.cache-hit != 'true' || needs.changes.outputs.network == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch'
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - name: Build exact-input network artifact once
        if: steps.network-artifact.outputs.cache-hit != 'true'
        run: bun run --cwd packages/waffle build:network
      - name: Rust native, state and actual WASM tests
        if: steps.network-artifact.outputs.cache-hit != 'true' || needs.changes.outputs.network == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch'
        run: |
          bun tooling/check-network-rust.ts
          cargo fmt --all -- --check
          cargo clippy --release --all-targets --features module-tests --locked -- -D warnings
          cargo test --release -p waffle-tcp --features module-tests --locked -- --nocapture
        working-directory: packages/waffle
        env:
          WAFFLE_TCP_MODULE: ${{ github.workspace }}/packages/waffle/browser/net/network.wasm
      - name: Report exact artifact and Rust cache hits
        run: |
          echo "network artifact cache-hit=${{ steps.network-artifact.outputs.cache-hit }}"
          echo "Rust cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
  procps-pure:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.procps-pure == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-pm-v2-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: ln -s "$GITHUB_WORKSPACE/packages/waffle/node_modules/@types" packages/procps/node_modules/@types
      - run: echo "$GITHUB_WORKSPACE/packages/waffle/node_modules/.bin" >> "$GITHUB_PATH"
      - run: bun run programs:procps:pure
  diffutils:
    needs: [changes, network-wasm]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.diffutils == 'true') }}
    runs-on: ubuntu-latest
    env:
      WAFFLE_NETWORK_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        id: network-artifact
        with:
          path: |
            packages/waffle/browser/net/network.wasm
            packages/waffle/browser/net/network.input-hash
            packages/waffle/browser/net/network.sha256
          key: network-wasm-v1-${{ hashFiles('packages/waffle/Cargo.toml', 'packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml', 'packages/waffle/network/Cargo.toml', 'packages/waffle/network/src/**', 'packages/waffle/tooling/build-network.ts') }}
          fail-on-cache-miss: true
      - name: Verify exact-input network artifact before installation
        run: bun run --cwd packages/waffle tooling/build-network.ts --verify
      - uses: actions/cache/restore@v4
        id: bun-cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-pm-v2-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
      - name: Record native compiler identity
        id: native-compiler
        run: |
          set -eu
          identity=$(
            {
              cc -dumpmachine
              cc --version | sed -n '1p'
            } | sha256sum | cut -d' ' -f1
          )
          printf 'identity=%s\n' "$identity" >> "$GITHUB_OUTPUT"
          printf 'native compiler identity: %s\n' "$identity"
      - uses: actions/cache@v4
        id: native-oracle
        with:
          path: .build/diffutils-native-oracle
          key: ${{ runner.os }}-${{ runner.arch }}-program-diffutils-native-oracle-v1-gnu-3.12-${{ hashFiles('packages/diffutils/sources.lock.json', 'packages/diffutils/scripts/build-native-oracle.ts') }}-${{ steps.native-compiler.outputs.identity }}
      - name: Build or verify native GNU diffutils oracle
        run: bun run --cwd packages/diffutils native-oracle
        env:
          NATIVE_ORACLE_COMPILER_IDENTITY: ${{ steps.native-compiler.outputs.identity }}
      - uses: actions/cache@v4
        id: diffutils-cache
        with:
          path: |
            .build/wasi-libc
            packages/diffutils/.build
            packages/diffutils/.sources
          key: ${{ runner.os }}-${{ runner.arch }}-program-diffutils-${{ hashFiles('packages/diffutils/sources.lock.json', 'packages/diffutils/patches/**', 'packages/diffutils/scripts/**', 'packages/diffutils/src/**', 'packages/diffutils/tests/**', 'packages/waffle/scripts/build-wasi-libc.sh', 'packages/waffle/patches/wasi-libc/**', 'tools/program-build-tools.ts', 'tools/program-package.ts') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-program-diffutils-
      - uses: actions/cache@v4
        id: sdk
        with:
          path: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          key: ${{ runner.os }}-wasi-sdk-34-b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
      - name: Install pinned wasi-sdk 34
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz -o wasi-sdk.tar.gz
          echo 'b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  wasi-sdk.tar.gz' | sha256sum -c -
          tar -xzf wasi-sdk.tar.gz
          rm wasi-sdk.tar.gz
      - uses: actions/cache@v4
        id: wasmtime
        with:
          path: ~/downloader/bin/wasmtime
          key: ${{ runner.os }}-wasmtime-49.0.3
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        if: steps.wasmtime.outputs.cache-hit != 'true'
        with:
          version: 49.0.3
      - name: Add cached Wasmtime to PATH
        run: |
          echo "$HOME/downloader/bin" >> "$GITHUB_PATH"
          "$HOME/downloader/bin/wasmtime" --version
      - uses: ./.github/actions/program-optimizer
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run prepare:package
      - run: bun run programs:check
      - name: Build and test diffutils
        run: |
          cmake --version
          ninja --version
          bun run programs:diffutils
        env:
          GNU_DIFF: ${{ github.workspace }}/.build/diffutils-native-oracle/diff
          GNU_CMP: ${{ github.workspace }}/.build/diffutils-native-oracle/cmp
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          WASI_LIBC_SCRATCH_ROOT: ${{ runner.temp }}
  gh:
    env:
      WAFFLE_NETWORK_PREBUILT: "1"
    needs: [changes, network-wasm]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.gh == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: actions/cache/restore@v4
        id: network-artifact
        with:
          path: |
            packages/waffle/browser/net/network.wasm
            packages/waffle/browser/net/network.input-hash
            packages/waffle/browser/net/network.sha256
          key: network-wasm-v1-${{ hashFiles('packages/waffle/Cargo.toml', 'packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml', 'packages/waffle/network/Cargo.toml', 'packages/waffle/network/src/**', 'packages/waffle/tooling/build-network.ts') }}
          fail-on-cache-miss: true
      - name: Verify exact-input network artifact before installation
        run: bun run --cwd packages/waffle tooling/build-network.ts --verify
      - name: Restore Bun package downloads
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-pm-v2-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run prepare:package
      - run: bun run programs:gh
  jq:
    env:
      WAFFLE_NETWORK_PREBUILT: "1"
    needs: [changes, network-wasm]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.jq == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        id: network-artifact
        with:
          path: |
            packages/waffle/browser/net/network.wasm
            packages/waffle/browser/net/network.input-hash
            packages/waffle/browser/net/network.sha256
          key: network-wasm-v1-${{ hashFiles('packages/waffle/Cargo.toml', 'packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml', 'packages/waffle/network/Cargo.toml', 'packages/waffle/network/src/**', 'packages/waffle/tooling/build-network.ts') }}
          fail-on-cache-miss: true
      - name: Verify exact-input network artifact before installation
        run: bun run --cwd packages/waffle tooling/build-network.ts --verify
      - uses: actions/cache/restore@v4
        id: bun-cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-pm-v2-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
      - uses: actions/cache@v4
        id: jq-cache
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            .build/jq
            .build/wasi-libc
            packages/jq/.build
            packages/jq/.sources
          key: ${{ runner.os }}-${{ runner.arch }}-program-jq-${{ hashFiles('bun.lock', 'rust-toolchain.toml', 'packages/jq/sources.lock.json', 'packages/jq/patches/**', 'packages/jq/scripts/**', 'packages/jq/src/**', 'packages/jq/tests/**', 'packages/waffle/scripts/build-wasi-libc.sh', 'packages/waffle/patches/wasi-libc/**', 'tools/program-build-tools.ts', 'tools/program-package.ts') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-program-jq-
      - uses: actions/cache@v4
        id: sdk
        with:
          path: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          key: ${{ runner.os }}-wasi-sdk-34-b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
      - uses: actions/cache@v4
        id: jq-native
        with:
          path: ${{ runner.temp }}/jq-native
          key: ${{ runner.os }}-${{ runner.arch }}-jq-native-1.8.2-x86_64-b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f
      - name: Download pinned jq native oracle
        if: steps.jq-native.outputs.cache-hit != 'true'
        env:
          JQ_NATIVE_DIR: ${{ runner.temp }}/jq-native
          JQ_NATIVE_URL: https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64
        run: |
          mkdir -p "$JQ_NATIVE_DIR"
          curl -fL --retry 3 "$JQ_NATIVE_URL" -o "$JQ_NATIVE_DIR/jq"
      - name: Verify and expose pinned jq native oracle
        env:
          JQ_NATIVE_DIR: ${{ runner.temp }}/jq-native
          JQ_NATIVE_SHA256: b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f
        run: |
          test -f "$JQ_NATIVE_DIR/jq"
          echo "$JQ_NATIVE_SHA256  $JQ_NATIVE_DIR/jq" | sha256sum -c -
          chmod 700 "$JQ_NATIVE_DIR/jq"
          echo "$JQ_NATIVE_DIR" >> "$GITHUB_PATH"
      - name: Install pinned wasi-sdk 34
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz -o wasi-sdk.tar.gz
