          key: ${{ runner.os }}-${{ runner.arch }}-program-tar-${{ hashFiles('bun.lock', 'rust-toolchain.toml', 'packages/tar/sources.lock.json', 'packages/tar/producer/**', 'packages/tar/patches/**', 'packages/tar/scripts/**', 'packages/tar/src/**', 'packages/tar/tests/**', 'packages/waffle/scripts/build-wasi-libc.sh', 'packages/waffle/patches/wasi-libc/**', 'tools/program-build-tools.ts', 'tools/program-package.ts') }}
