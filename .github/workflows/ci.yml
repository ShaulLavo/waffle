name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.4"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      libc: ${{ steps.paths.outputs.libc }}
      browser: ${{ steps.paths.outputs.browser }}
      network: ${{ steps.paths.outputs.network }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          base: ${{ github.ref }}
          filters: |
            network:
              - ".github/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "network/**"
              - "tooling/build-network.ts"
              - "tooling/check-network-rust.ts"
              - "build.ts"
              - "prepare.ts"
              - "tooling/network-size.ts"
              - "browser/net/module.ts"
              - "browser/net/namespace.ts"
              - "tests/network-module.test.ts"
              - "tests/network-module-host.test.ts"
              - "tests/network-wire.test.ts"
              - "tests/network-size.test.ts"
              - "tests/network-lazy.test.ts"
              - "tests/packaging.test.ts"
              - "tests/git-install.test.ts"
              - "tests/node-exports.test.ts"
              - "tests/runtime-size.test.ts"
            browser:
              - ".github/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "network/**"
              - "tooling/build-network.ts"
              - "tooling/check-network-rust.ts"
              - "build.ts"
              - "prepare.ts"
              - "core/**"
              - "fs/**"
              - "proc/**"
              - "interrupt/**"
              - "browser/**"
              - "runtime.ts"
              - "index.ts"
              - "package.json"
              - "bun.lock"
              - "scripts/test-browser.ts"
              - "scripts/browser-command.ts"
              - "scripts/browser-supervisor.ts"
              - "scripts/owned-command.ts"
              - "tests/**"
            libc:
              - '.github/**'
              - 'patches/**'
              - 'scripts/build-wasi-libc.sh'
              - 'scripts/test-wasi-libc.ts'
              - 'scripts/owned-command.ts'
              - 'core/**'
              - 'fs/**'
              - 'proc/**'
              - 'interrupt/**'
              - 'browser/**'
              - 'runtime.ts'
              - 'index.ts'
              - 'package.json'
              - 'bun.lock'
              - 'tests/wasi-libc.test.ts'
              - 'tests/fixtures/**'
  network-wasm:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        id: network-artifact
        with:
          path: |
            browser/net/network.wasm
            browser/net/network.input-hash
            browser/net/network.sha256
          key: network-wasm-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'network/Cargo.toml', 'network/src/**', 'tooling/build-network.ts') }}
      - name: Cache Rust toolchain and Cargo build inputs
        if: steps.network-artifact.outputs.cache-hit != 'true' || needs.changes.outputs.network == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        id: rust-cache
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-network-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('network/**/*.rs') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-network-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - uses: dtolnay/rust-toolchain@stable
        if: steps.network-artifact.outputs.cache-hit != 'true' || needs.changes.outputs.network == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch'
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - name: Build exact-input network artifact once
        if: steps.network-artifact.outputs.cache-hit != 'true'
        run: bun run build:network
      - name: Rust native, state and actual WASM tests
        if: steps.network-artifact.outputs.cache-hit != 'true' || needs.changes.outputs.network == 'true' || needs.changes.result != 'success' || github.event_name == 'workflow_dispatch'
        run: |
          bun tooling/check-network-rust.ts
          cargo fmt --all -- --check
          cargo clippy --release --all-targets --features module-tests --locked -- -D warnings
          cargo test --release -p waffle-tcp --features module-tests --locked -- --nocapture
        env:
          WAFFLE_TCP_MODULE: ${{ github.workspace }}/browser/net/network.wasm
      - name: Report exact artifact and Rust cache hits
        run: |
          echo "network artifact cache-hit=${{ steps.network-artifact.outputs.cache-hit }}"
          echo "Rust cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
  package:
    env:
      WAFFLE_NETWORK_PREBUILT: "1"
    needs: network-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache/restore@v4
        id: network-artifact
        with:
          path: |
            browser/net/network.wasm
            browser/net/network.input-hash
            browser/net/network.sha256
          key: network-wasm-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'network/Cargo.toml', 'network/src/**', 'tooling/build-network.ts') }}
          fail-on-cache-miss: true
      - name: Verify exact-input network artifact before installation
        run: bun tooling/build-network.ts --verify
      - name: Cache Bun package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-pm-v2-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun install --cwd site --frozen-lockfile
      - run: bun run quality
      - run: bun run test && bun run test:ci
      - run: bun run size && bun run size:network
      - run: test -z "$(git ls-files dist)"
  libc:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.libc == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        id: wasmtime
        with:
          path: ~/downloader/bin/wasmtime
          key: ${{ runner.os }}-wasmtime-49.0.3
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        if: steps.wasmtime.outputs.cache-hit != 'true'
        with:
          version: 49.0.3
      - name: Add cached Wasmtime to PATH
        run: |
          echo "$HOME/downloader/bin" >> "$GITHUB_PATH"
          "$HOME/downloader/bin/wasmtime" --version
      - uses: actions/cache@v4
        id: fixtures
        with:
          path: ${{ runner.temp }}/libc-fixtures
          key: ${{ runner.os }}-libc-sdk34-bun${{ env.BUN_VERSION }}-${{ hashFiles('scripts/build-wasi-libc.sh', 'scripts/test-wasi-libc.ts', 'scripts/owned-command.ts', 'patches/wasi-libc/**', 'tests/fixtures/preopen-guest.c', 'tests/fixtures/wasm-start-section.ts') }}
      - uses: actions/cache@v4
        if: steps.fixtures.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/libc-sysroot
          key: ${{ runner.os }}-libc-sysroot-sdk34-${{ hashFiles('scripts/build-wasi-libc.sh', 'patches/wasi-libc/**') }}
      - uses: actions/cache@v4
        if: steps.fixtures.outputs.cache-hit != 'true'
        id: sdk
        with:
          path: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          key: ${{ runner.os }}-wasi-sdk-34-b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
      - name: Install pinned wasi-sdk 34
        if: steps.fixtures.outputs.cache-hit != 'true' && steps.sdk.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz -o wasi-sdk.tar.gz
          echo 'b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  wasi-sdk.tar.gz' | sha256sum -c -
          tar -xzf wasi-sdk.tar.gz
          rm wasi-sdk.tar.gz
      - run: bun run test:libc
        env:
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          WASI_LIBC_SCRATCH_ROOT: ${{ runner.temp }}
          WASMTIME: wasmtime
          WASI_LIBC_FIXTURE_CACHE: ${{ runner.temp }}/libc-fixtures
          WASI_LIBC_SYSROOT_CACHE: ${{ runner.temp }}/libc-sysroot
  browser:
    env:
      WAFFLE_NETWORK_PREBUILT: "1"
    needs: [changes, network-wasm]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.result != 'success' || needs.changes.outputs.browser == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache/restore@v4
        id: network-artifact
        with:
          path: |
            browser/net/network.wasm
            browser/net/network.input-hash
            browser/net/network.sha256
          key: network-wasm-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'network/Cargo.toml', 'network/src/**', 'tooling/build-network.ts') }}
          fail-on-cache-miss: true
      - name: Verify exact-input network artifact before installation
        run: bun tooling/build-network.ts --verify
      - name: Restore Bun package downloads
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-pm-v2-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - name: Use Ubuntu HTTPS archives for browser dependencies
        run: |
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          test -s /etc/apt/apt-mirrors.txt
          cat /etc/apt/apt-mirrors.txt
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run test:browser 2>&1 | tee "$RUNNER_TEMP/waffle-browser-protocol.log"
        shell: bash
        env:
          DEBUG: pw:protocol
          RECOVERY_R42_REPORT: ${{ runner.temp }}/recovery-r42-report.json
          STORAGE_SCRATCH_ROOT: ${{ runner.temp }}
          PROCESS_SCRATCH_ROOT: ${{ runner.temp }}
      - run: bun tests/publication-browser-runner.ts --workspace chromium
        env:
          STORAGE_SCRATCH_ROOT: ${{ runner.temp }}
      - name: Retain recovery failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-recovery-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-r42-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain browser failure protocol
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-protocol-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/waffle-browser-protocol.log
          retention-days: 7
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Restore Bun package downloads
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-pm-v2-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build
