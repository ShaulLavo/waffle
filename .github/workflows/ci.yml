      - run: bun install --frozen-lockfile --ignore-scripts
        if: steps.select.outputs.libc_or_browser == 'true'
      - name: Restore standard native relay prebuild downloads
        if: steps.select.outputs.libc_or_browser == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm/_prebuilds
          key: ${{ runner.os }}-${{ runner.arch }}-relay-prebuild-v1-${{ hashFiles('bun.lock', 'packages/waffle-relay/package.json', 'packages/waffle-relay/scripts/prepare-native.ts', 'packages/waffle-relay/src/webtransport-integrity.ts') }}
      - name: Prepare and verify the required native relay prebuild
        if: steps.select.outputs.libc_or_browser == 'true'
        run: bun packages/waffle-relay/scripts/prepare-native.ts
      - run: bun run prepare:package
        if: steps.select.outputs.libc_or_browser == 'true'
      - uses: actions/cache@v4
        id: sdk
        if: steps.select.outputs.need_wasi_sdk == 'true'
        with:
          path: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          key: ${{ runner.os }}-wasi-sdk-34-b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
      - name: Install pinned wasi-sdk 34
        if: steps.select.outputs.need_wasi_sdk == 'true' && steps.sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/tools/ci-release-download.ts" https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz wasi-sdk.tar.gz 300000
          printf '%s  %s\n' b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4 wasi-sdk.tar.gz | sha256sum --check --status
          tar -xzf wasi-sdk.tar.gz
          rm wasi-sdk.tar.gz
      - uses: actions/cache@v4
        id: wasmtime
        if: steps.select.outputs.libc_or_browser == 'true'
        with:
          path: ~/downloader/bin/wasmtime
          key: ${{ runner.os }}-wasmtime-49.0.3
      - uses: ./.github/actions/setup-wasmtime
        if: steps.select.outputs.libc_or_browser == 'true' && steps.wasmtime.outputs.cache-hit != 'true'
      - name: Add cached Wasmtime to PATH
        if: steps.select.outputs.libc_or_browser == 'true'
        run: |
          echo "$HOME/downloader/bin" >> "$GITHUB_PATH"
          "$HOME/downloader/bin/wasmtime" --version
      - name: Cache Rust threads toolchain for browser fixtures
        id: browser-rust-cache
        if: steps.select.outputs.browser == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-shared-rust-1.98.1-p1-false-thr-true-v1-${{ hashFiles('Cargo.lock', 'packages/coreutils/crates/checksums/Cargo.lock', 'packages/tar/producer/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-shared-rust-1.98.1-p1-false-thr-true-v1-
            ${{ runner.os }}-${{ runner.arch }}-shared-rust-1.98.1-p1-true-thr-true-v1-
            ${{ runner.os }}-${{ runner.arch }}-shared-rust-1.98.1-
      - uses: dtolnay/rust-toolchain@stable
        if: steps.select.outputs.browser == 'true'
        with:
          toolchain: "1.98.1"
          targets: wasm32-wasip1-threads
          components: rustfmt
      # Libc, memory-group, GPU and Rust threads fixtures (used directly by browser steps below).
      - uses: actions/cache@v4
        id: group-fixture
        if: steps.select.outputs.libc_or_browser == 'true'
        with:
          path: ${{ runner.temp }}/memory-group-fixture
          key: ${{ runner.os }}-memory-group-fixture-sdk34-b761e3a0-${{ hashFiles('packages/waffle/tests/fixtures/memory-group-member.c', 'packages/waffle/scripts/build-memory-group-fixture.ts') }}
      - uses: actions/cache@v4
        id: gpu-fixture
        if: steps.select.outputs.libc_or_browser == 'true'
        with:
          path: ${{ runner.temp }}/gpu-fixture
          key: ${{ runner.os }}-gpu-fixture-sdk34-b761e3a0-${{ hashFiles('packages/waffle/tests/fixtures/gpu/triangle.c', 'packages/waffle/tests/fixtures/gpu/scene.c', 'packages/waffle/tests/fixtures/gpu/async.c', 'packages/waffle/tests/fixtures/gpu/async_encode.h', 'packages/waffle/tests/fixtures/gpu/async-expected.json', 'packages/waffle/tests/fixtures/gpu/scene_encode.h', 'packages/waffle/tests/fixtures/gpu/gpu_fixture.h', 'packages/waffle/tests/fixtures/gpu/gpu_encode.h', 'packages/waffle/tests/fixtures/gpu/waffle_gpu_stream.h', 'packages/waffle/tests/fixtures/gpu/expected.json', 'packages/waffle/tests/fixtures/gpu/enums.json', 'packages/waffle/browser/gpu/upstream/LICENSE', 'packages/waffle/browser/gpu/upstream/webgpu.yml', 'packages/waffle/browser/gpu/upstream/webgpu.h', 'packages/waffle/browser/gpu/stream.json', 'packages/waffle/browser/gpu/generated/tables.ts', 'packages/waffle/tooling/gpu-stream*.ts', 'packages/waffle/scripts/build-gpu-fixture.ts', 'packages/waffle/scripts/owned-command.ts', 'packages/waffle/browser/gpu/metadata.ts', 'packages/waffle/browser/gpu/codec.ts', 'packages/waffle/tests/fixtures/gpu/scene-expected.json', 'packages/waffle/tests/fixtures/gpu/compute-expected.json', 'packages/waffle/tests/fixtures/gpu/bundle-query-expected.json', 'packages/waffle/tests/fixtures/gpu/copy-draw-expected.json', 'packages/waffle/tests/fixtures/gpu/label-expected.json', 'packages/waffle/browser/display/generated/graphics-layout.ts') }}
      - uses: actions/cache@v4
        id: fixtures
        if: steps.select.outputs.libc == 'true'
        with:
          path: ${{ runner.temp }}/libc-fixtures
          key: ${{ runner.os }}-libc-sdk34-bun${{ env.BUN_VERSION }}-${{ hashFiles('packages/waffle/scripts/build-wasi-libc.sh', 'packages/waffle/scripts/test-wasi-libc.ts', 'packages/waffle/scripts/owned-command.ts', 'packages/waffle/patches/wasi-libc/**', 'packages/waffle/tests/fixtures/preopen-guest.c', 'packages/waffle/tests/fixtures/preview1-socket.c', 'packages/waffle/tests/fixtures/wasm-start-section.ts') }}
      - uses: actions/cache@v4
        if: steps.select.outputs.libc == 'true' && steps.fixtures.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/libc-sysroot
          key: ${{ runner.os }}-libc-sysroot-sdk34-${{ hashFiles('packages/waffle/scripts/build-wasi-libc.sh', 'packages/waffle/patches/wasi-libc/**') }}
      - name: Test the wasm32 source sentinel with the pinned SDK
        if: steps.select.outputs.libc_or_browser == 'true'
        env:
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
        run: |
          bun test packages/waffle/tests/gpu-async-stream.test.ts --test-name-pattern '^wasm32 C whole-map sentinel normalizes before widening against pinned header$' --reporter=junit --reporter-outfile "$RUNNER_TEMP/gpu-source-tests.xml"
          python3 - "$RUNNER_TEMP/gpu-source-tests.xml" <<'PYTHON'
          import sys
          import xml.etree.ElementTree as ET
          name = "wasm32 C whole-map sentinel normalizes before widening against pinned header"
          cases = [case for case in ET.parse(sys.argv[1]).iter("testcase") if case.get("name") == name]
          assert len(cases) == 1, "Missing or repeated wasm32 source sentinel control"
          assert all(cases[0].find(tag) is None for tag in ("skipped", "failure", "error")), "Source sentinel control skipped or failed"
          print("Verified the pinned wasm32 source sentinel without skips")
          PYTHON
      - name: Build the memory group fixture once
        if: steps.select.outputs.libc_or_browser == 'true' && steps.group-fixture.outputs.cache-hit != 'true'
        run: bun packages/waffle/scripts/build-memory-group-fixture.ts "$RUNNER_TEMP/memory-group-fixture"
        env:
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
      - name: Verify the memory group fixture
        if: steps.select.outputs.libc_or_browser == 'true'
        run: bun packages/waffle/scripts/build-memory-group-fixture.ts --verify "$RUNNER_TEMP/memory-group-fixture"
      - name: Build the compiled GPU guest once
        if: steps.select.outputs.libc_or_browser == 'true' && steps.gpu-fixture.outputs.cache-hit != 'true'
        run: bun packages/waffle/scripts/build-gpu-fixture.ts "$RUNNER_TEMP/gpu-fixture"
        env:
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
      - name: Verify the compiled GPU guest
        if: steps.select.outputs.libc_or_browser == 'true'
        run: bun packages/waffle/scripts/build-gpu-fixture.ts --verify "$RUNNER_TEMP/gpu-fixture"
      - name: Test the compiled GPU fixture without rebuilding it
        if: steps.select.outputs.libc_or_browser == 'true'
        env:
          GPU_FIXTURE_DIR: ${{ runner.temp }}/gpu-fixture
        run: |
          bun test packages/waffle/tests/gpu-fixture.test.ts packages/waffle/tests/gpu-fixture-closed.test.ts packages/waffle/tests/gpu-scene-fixture.test.ts packages/waffle/tests/gpu-fairness-fixture.test.ts packages/waffle/tests/gpu-async-fixture.test.ts --test-name-pattern 'compiled Preview 1 C fixture|compiled C closed replies during waits|compiled C completion handling|bounded frame-mode wire controls|compiled textured depth scene|compiled fairness fixture|real compiled C decoder under protocol controls, not native acceptance' --reporter=junit --reporter-outfile "$RUNNER_TEMP/gpu-fixture-tests.xml"
          python3 - "$RUNNER_TEMP/gpu-fixture-tests.xml" <<'PYTHON'
          import sys
          import xml.etree.ElementTree as ET
          names = {"compiled Preview 1 C fixture", "compiled C completion handling, not GPU acceptance", "bounded frame-mode wire controls, not native GPU acceptance", "compiled textured depth scene, protocol assertions", "compiled fairness fixture, protocol and deterministic scheduling"}
          async_name = "real compiled C decoder under protocol controls, not native acceptance"
          closed_name = "compiled C closed replies during waits"
          names = names | {async_name, closed_name}
          suites = [suite for suite in ET.parse(sys.argv[1]).iter("testsuite") if suite.get("name") in names]
          assert {suite.get("name") for suite in suites} == names, "Missing compiled GPU fixture suite"
          assert all(suite.findall("testcase") for suite in suites), "Empty compiled GPU fixture suite"
          cases = [case for suite in suites for case in suite.findall("testcase")]
          historical = [case for suite in suites if suite.get("name") not in {async_name, closed_name} for case in suite.findall("testcase")]
          asynchronous = [case for suite in suites if suite.get("name") == async_name for case in suite.findall("testcase")]
          closed = [case for suite in suites if suite.get("name") == closed_name for case in suite.findall("testcase")]
          assert len(closed) >= 84, "Compiled closed-reply fixture tests did not execute"
          assert len(historical) >= 35, "Historical compiled GPU fixture tests did not execute"
          assert len(asynchronous) >= 20, "Compiled async GPU fixture tests did not execute"
          assert all(case.find(tag) is None for case in cases for tag in ("skipped", "failure", "error")), "Compiled GPU fixture tests skipped or failed"
          print(f"Verified {len(cases)} compiled GPU fixture tests without skips")
          PYTHON
      - run: bun run test:libc
        if: steps.select.outputs.libc == 'true'
        env:
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          WASI_LIBC_SCRATCH_ROOT: ${{ runner.temp }}
          WASMTIME: wasmtime
          WASI_LIBC_FIXTURE_CACHE: ${{ runner.temp }}/libc-fixtures
          WASI_LIBC_SYSROOT_CACHE: ${{ runner.temp }}/libc-sysroot
      - name: Build the real Rust threads fixture twice and verify receipts and tamper failures
        if: steps.select.outputs.browser == 'true'
        run: |
          bun test ./packages/waffle/scripts/threads-fixture-producer.test.ts --timeout 120000
          rustfmt +1.98.1 --check packages/waffle/tests/fixtures/threads.rs
        env:
          THREAD_FIXTURE_TEST_ROOT: ${{ runner.temp }}
          THREAD_FIXTURE_EXPORT_DIR: ${{ runner.temp }}/threads-fixture
      - name: Verify the Rust threads fixture without a compiler
        if: steps.select.outputs.browser == 'true'
        run: bun packages/waffle/scripts/build-thread-fixture.ts --verify
        env:
          THREAD_FIXTURE_DIR: ${{ runner.temp }}/threads-fixture

      # Browser matrix (all runtime + reporter checks on this same runner).
      - name: Resolve the Playwright browser cache key
        if: steps.select.outputs.browser == 'true'
        id: playwright-cache
        run: |
          browsers=$(bun --no-install -e 'const { createRequire } = require("node:module"); const { dirname, join } = require("node:path"); const local = createRequire(require.resolve("playwright/package.json")); console.log(join(dirname(local.resolve("playwright-core/package.json")), "browsers.json"))')
          test -s "$browsers"
          . /etc/os-release
          echo "key=${RUNNER_OS:?}-${RUNNER_ARCH:?}-${ID:?}${VERSION_ID:?}-playwright-v1-$(sha256sum "$browsers" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.select.outputs.browser == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.key }}
      - uses: ./.github/actions/ubuntu-main-archive
        if: steps.select.outputs.browser == 'true'
      - name: Install Playwright browsers and system dependencies
        if: steps.select.outputs.browser == 'true'
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: Run complete browser matrix
        id: browser-tests
        if: steps.select.outputs.browser == 'true'
        shell: bash
        run: bun run test:browser 2>&1 | tee "$RUNNER_TEMP/waffle-browser-protocol.log"
        env:
          GPU_FIXTURE_DIR: ${{ runner.temp }}/gpu-fixture
          MEMORY_GROUP_FIXTURE_DIR: ${{ runner.temp }}/memory-group-fixture
          THREAD_FIXTURE_DIR: ${{ runner.temp }}/threads-fixture
          RECOVERY_R42_REPORT: ${{ runner.temp }}/recovery-r42-report.json
          BROWSER_CONTROLS_RESULT: ${{ runner.temp }}/browser-controls-results.json
          STORAGE_SCRATCH_ROOT: ${{ runner.temp }}
          PROCESS_SCRATCH_ROOT: ${{ runner.temp }}
      - name: Run Chromium publication workspace check
        if: ${{ !cancelled() && steps.select.outputs.browser == 'true' && (steps.browser-tests.outcome == 'success' || steps.browser-tests.outcome == 'failure') }}
        run: bun packages/waffle/tests/publication-browser-runner.ts --workspace chromium
        env:
          STORAGE_SCRATCH_ROOT: ${{ runner.temp }}
      - name: Retain recovery failure report
        if: failure() && steps.select.outputs.browser == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: browser-recovery-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-r42-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain browser controls result and process outcome
        if: always() && steps.select.outputs.browser == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: browser-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-controls-results.json*
          if-no-files-found: warn
          retention-days: 7
      - name: Retain browser failure protocol
        if: failure() && steps.select.outputs.browser == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: browser-protocol-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/waffle-browser-protocol.log
          retention-days: 7

      - name: Require successful change detection
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
        env:
          PATHS_RESULT: ${{ steps.paths.outcome }}
        run: |
          if [[ "$PATHS_RESULT" != success ]]; then
            echo '::error::Complete CI requires successful change detection.'
            exit 1
          fi
      - uses: ./.github/actions/save-release-downloads
        if: always() && env.CI_RELEASE_CACHE_INITIAL != ''

  gate:
    name: Complete CI gate
    needs: [core, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a ready PR
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo '::error::Mark this PR ready for review to run the required checks.'
          exit 1
      - name: Require core and browser gates
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
        env:
          CORE: ${{ needs.core.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          if [[ "$CORE" != success || "$BROWSER" != success ]]; then
            echo "::error::Complete CI requires core ($CORE) and browser ($BROWSER) to succeed."
            exit 1
          fi
