name: CI

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run prepare
      - run: bun run check
      - run: bun run check:nodenext
      - run: bun test
      - run: bun run size
      - run: test -z "$(git ls-files dist)"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run prepare
      - run: bunx playwright install --with-deps
      - run: bun tests/storage-browser-runner.ts chromium firefox webkit
        env:
          STORAGE_SCRATCH_ROOT: ${{ runner.temp }}
      - run: bun tests/process-recycling-browser-runner.ts chromium firefox webkit
        env:
          PROCESS_SCRATCH_ROOT: ${{ runner.temp }}
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
