name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - name: Runtime type check
        run: node_modules/.bin/tsc -p ../crates/bunwasm-runtime/tsconfig.json
      - name: Runtime emission and native type regressions
        run: bun test ../scripts/runtime-emission.test.ts ../scripts/runtime-types.test.ts ../scripts/worker-codec.test.ts ../scripts/worker-selectors.test.ts ../scripts/worker-outcome.test.ts
      - name: Install runtime and sandbox dependencies
        run: |
          bun install --cwd ../runtime --frozen-lockfile
          bun install --cwd ../sandbox --frozen-lockfile
      - name: Unit tests (web, runtime and download accounting)
        run: |
          bun run test
          bun test ../runtime/tests ../scripts/runtime-size.test.ts
          PYTHONDONTWRITEBYTECODE=1 python3 ../scripts/test-bun-suite.py ReportTests.test_browser_provenance_hashes_runtime_core
      - name: Type check
        run: |
          bun run check
          bun run --cwd ../runtime check
          bun run --cwd ../sandbox check
      - name: Runtime bundle budgets and Bun light initial downloads (no WASM)
        run: bun ../scripts/runtime-size.ts
      - name: Install Chromium and WebKit
        run: bunx playwright install --with-deps chromium webkit
      - name: Browser host smoke (no Rust or dist artifacts)
        env:
          SMOKE_PORT: "4179"
        run: |
          listeners=$(ss -H -ltn "sport = :$SMOKE_PORT")
          test -z "$listeners"
          bun run test:browser
      - name: Scoped split-worker and classic service-worker smoke (no WASM)
        env:
          SPLIT_SMOKE_PORT: "4180"
        run: bun tests/browser-splitting.mjs
      - name: Native browser stream completion and abort
        env:
          PLAYWRIGHT: ${{ github.workspace }}/web/node_modules/playwright/index.mjs
        run: node ../scripts/test-native-stream-interop.mjs
      - name: Shared filesystem service and blocking worker adapter (no WASM)
        env:
          FS_SMOKE_PORT: "4181"
        run: bun tests/browser-filesystem.ts
      - name: IndexedDB persistence, durable saves and crash recovery (no WASM)
        env:
          PERSIST_SMOKE: "1"
          PERSISTENCE_PORT: "4182"
        run: bun tests/browser-persistence.ts chromium
      - name: OPFS persistence, file fsync and crash recovery (no WASM)
        env:
          PERSIST_SMOKE: "1"
          PERSIST_STORAGE: "opfs"
          PERSISTENCE_PORT: "4182"
        run: bun tests/browser-persistence.ts chromium
      - name: Editor durable saves and template reset (no WASM)
        env:
          EDITOR_SCRATCH_ROOT: ${{ runner.temp }}
          EDITOR_PORT: "4183"
        run: bun tests/browser-editor.ts chromium

  browser-process:
    name: Processes (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install browser
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Process supervisor, generic preview1 and interrupt gate (no Rust or dist artifacts)
        env:
          PROCESS_SMOKE_PORT: "4186"
          TMPDIR: ${{ runner.temp }}
        run: bun tests/browser-process.ts ${{ matrix.browser }}
      - name: Process pipes and runtime_proc guest ABI (no Rust or dist artifacts)
        env:
          TMPDIR: ${{ runner.temp }}
        run: bun tests/browser-runtime-proc.ts ${{ matrix.browser }}
