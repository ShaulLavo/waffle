name: CI

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run prepare
      - run: bun install --cwd site --frozen-lockfile
      - run: bun run quality
      - run: bun test
      - run: bun run size
      - run: test -z "$(git ls-files dist)"
  libc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: 49.0.3
      - run: bun install --frozen-lockfile
      - name: Install pinned wasi-sdk 34
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz -o wasi-sdk.tar.gz
          echo 'b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  wasi-sdk.tar.gz' | sha256sum -c -
          tar -xzf wasi-sdk.tar.gz
          rm wasi-sdk.tar.gz
      - run: bun run test:libc
        env:
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          WASI_LIBC_SCRATCH_ROOT: ${{ runner.temp }}
          WASMTIME: wasmtime
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run prepare
      - run: bunx playwright install --with-deps
      - run: bun tests/storage-browser-runner.ts chromium firefox webkit
        env:
          STORAGE_SCRATCH_ROOT: ${{ runner.temp }}
      - run: bun tests/storage-lock-browser-runner.ts chromium firefox webkit
        env:
          STORAGE_SCRATCH_ROOT: ${{ runner.temp }}
      - run: bun tests/process-recycling-browser-runner.ts chromium firefox webkit
        env:
          PROCESS_SCRATCH_ROOT: ${{ runner.temp }}
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
