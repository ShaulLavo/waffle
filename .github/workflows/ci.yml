            programs:
              - ".github/actions/rust-build-cache/action.yml"
              - ".github/workflows/ci.yml"
              - ".github/actions/release-downloads/**"
              - ".github/actions/save-release-downloads/**"
              - ".github/actions/setup-tools/**"
              - "tools/ci-*.ts"
              - ".github/actions/program-optimizer/action.yml"
              - "package.json"
              - "bun.lock"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "tools/**"
              - "scripts/**"
              - "packages/waffle/**"
              - "packages/program-support/**"
              - "packages/process-consumer/**"
              - "packages/coreutils/**"
              - "packages/grep/**"
              - "packages/findutils/**"
              - "packages/sed/**"
              - "packages/ripgrep/**"
              - "packages/base/**"
              - "packages/python/**"
              - "packages/git/**"
              - "packages/tar/**"
            diffutils:
              - ".github/actions/setup-wasmtime/**"
              - ".github/workflows/ci.yml"
              - ".github/actions/release-downloads/**"
              - ".github/actions/save-release-downloads/**"
              - ".github/actions/setup-tools/**"
              - "tools/ci-*.ts"
              - ".github/actions/program-optimizer/action.yml"
              - "package.json"
              - "bun.lock"
              - "tools/program-build-tools.ts"
              - "tools/program-optimize.ts"
              - "tools/program-derivation.ts"
              - "tools/program-symbols.ts"
              - "tools/program-package.ts"
              - "tools/family-acceptance.ts"
              - "tools/tsconfig.programs.json"
              - "packages/waffle/**"
              - "packages/base/**"
              - "packages/diffutils/**"
            gh:
              - ".github/workflows/ci.yml"
              - ".github/actions/release-downloads/**"
              - ".github/actions/save-release-downloads/**"
              - ".github/actions/setup-tools/**"
              - "tools/ci-*.ts"
              - "package.json"
              - "bun.lock"
              - "tools/program-package.ts"
              - "tools/tsconfig.programs.json"
              - "packages/waffle/**"
              - "packages/gh/**"
            jq:
              - ".github/actions/setup-wasmtime/**"
              - ".github/workflows/ci.yml"
              - ".github/actions/release-downloads/**"
              - ".github/actions/save-release-downloads/**"
              - ".github/actions/setup-tools/**"
              - "tools/ci-*.ts"
              - ".github/actions/program-optimizer/action.yml"
              - "package.json"
              - "bun.lock"
              - "rust-toolchain.toml"
              - "tools/program-build-tools.ts"
              - "tools/program-optimize.ts"
              - "tools/program-derivation.ts"
              - "tools/program-symbols.ts"
              - "tools/program-package.ts"
              - "tools/family-acceptance.ts"
              - "tools/tsconfig.programs.json"
              - "packages/waffle/**"
              - "packages/base/**"
              - "packages/jq/**"
            curl:
              - ".github/workflows/ci.yml"
              - ".github/actions/release-downloads/**"
              - ".github/actions/save-release-downloads/**"
              - ".github/actions/setup-tools/**"
              - "tools/ci-*.ts"
              - "package.json"
              - "bun.lock"
              - "tools/program-package.ts"
              - "tools/tsconfig.programs.json"
              - "packages/curl/**"
            awk:
              - ".github/actions/setup-wasmtime/**"
              - ".github/workflows/ci.yml"
              - ".github/actions/release-downloads/**"
              - ".github/actions/save-release-downloads/**"
              - ".github/actions/setup-tools/**"
              - "tools/ci-*.ts"
              - ".github/actions/program-optimizer/action.yml"
              - "package.json"
              - "bun.lock"
              - "tools/program-build-tools.ts"
              - "tools/program-optimize.ts"
              - "tools/program-derivation.ts"
              - "tools/program-symbols.ts"
              - "tools/program-package.ts"
              - "tools/program-notices.ts"
              - "tools/family-acceptance.ts"
              - "tools/tsconfig.programs.json"
              - "packages/waffle/**"
              - "packages/base/**"
              - "packages/awk/**"
            tar:
              - ".github/actions/setup-wasmtime/**"
              - ".github/workflows/ci.yml"
              - ".github/actions/release-downloads/**"
              - ".github/actions/save-release-downloads/**"
              - ".github/actions/setup-tools/**"
              - "tools/ci-*.ts"
              - ".github/actions/program-optimizer/action.yml"
              - "package.json"
              - "bun.lock"
              - "rust-toolchain.toml"
              - "tools/program-build-tools.ts"
              - "tools/program-optimize.ts"
              - "tools/program-derivation.ts"
              - "tools/program-symbols.ts"
              - "tools/program-package.ts"
              - "tools/family-acceptance.ts"
              - "tools/tsconfig.programs.json"
              - "packages/waffle/**"
              - "packages/base/**"
              - "packages/tar/**"
            procps:
              - ".github/workflows/ci.yml"
              - ".github/actions/release-downloads/**"
              - ".github/actions/save-release-downloads/**"
              - ".github/actions/setup-tools/**"
              - "tools/ci-*.ts"
              - "package.json"
              - "bun.lock"
              - "packages/waffle/**"
              - "packages/procps/**"
            browser:
              - ".github/workflows/ci.yml"
              - ".github/workflows/threads-fixture.yml"
              - ".github/actions/release-downloads/**"
              - ".github/actions/save-release-downloads/**"
              - ".github/actions/setup-tools/**"
              - "tools/ci-*.ts"
              - "packages/waffle/Cargo.toml"
              - "packages/waffle/Cargo.lock"
              - "packages/waffle/rust-toolchain.toml"
              - "packages/waffle/network/**"
              - "packages/waffle/tooling/build-network.ts"
              - "packages/waffle/tooling/network-translator.ts"
              - "packages/waffle/tooling/network-translator.test.ts"
              - "packages/waffle/tooling/network-source-smoke.ts"
              - "packages/waffle/tooling/network-translator/**"
              - "packages/waffle/tooling/network-growth.ts"
              - "packages/waffle/tooling/check-network-rust.ts"
              - "packages/waffle/build.ts"
              - "packages/waffle/prepare.ts"
              - "packages/waffle/core/**"
              - "packages/waffle/fs/**"
              - "packages/waffle/proc/**"
              - "packages/waffle/interrupt/**"
              - "packages/waffle/thread/**"
              - "packages/waffle/memory/**"
              - "packages/waffle/browser/**"
              - "packages/waffle/search/**"
              - "packages/waffle/group/**"
              - "packages/waffle/link/**"
              - "packages/waffle/runtime.ts"
              - "packages/waffle/index.ts"
              - "package.json"
              - "packages/waffle/package.json"
              - "bun.lock"
              - "rust-toolchain.toml"
              - "packages/waffle/scripts/build-thread-fixture.ts"
              - "packages/waffle/scripts/threads-fixture-producer.test.ts"
              - "packages/waffle/scripts/build-memory-group-fixture.ts"
              - "packages/waffle/scripts/build-gpu-fixture.ts"
              - "packages/waffle/scripts/test-browser.ts"
              - "packages/waffle/scripts/browser-command.ts"
              - "packages/waffle/scripts/browser-supervisor.ts"
              - "packages/waffle/scripts/owned-command.ts"
              - "packages/waffle-relay/scripts/prepare-native.ts"
              - "packages/waffle-relay/tests/prepare-native.test.ts"
              - "packages/waffle-relay/src/**"
              - "packages/waffle-relay/package.json"
              - "packages/waffle/tooling/workspace-safari-runner.ts"
              - "packages/waffle/tests/**"
              - "packages/waffle/testing/**"
            libc:
              - ".github/actions/setup-wasmtime/**"
              - ".github/workflows/ci.yml"
              - ".github/actions/release-downloads/**"
              - ".github/actions/save-release-downloads/**"
              - ".github/actions/setup-tools/**"
              - "tools/ci-*.ts"
              - "packages/waffle/patches/**"
              - "packages/waffle/scripts/build-wasi-libc.sh"
              - "packages/waffle/scripts/test-wasi-libc.ts"
              - "packages/waffle/scripts/owned-command.ts"
              - "packages/waffle/core/**"
              - "packages/waffle/fs/**"
              - "packages/waffle/proc/**"
              - "packages/waffle/interrupt/**"
              - "packages/waffle/browser/**"
              - "packages/waffle/runtime.ts"
              - "packages/waffle/index.ts"
              - "package.json"
              - "packages/waffle/package.json"
              - "bun.lock"
              - "packages/waffle/tests/wasi-libc.test.ts"
              - "packages/waffle/tests/preview1-socket-libc.test.ts"
              - "packages/waffle/tests/preview1-socket-support.ts"
              - "packages/waffle/tests/fixtures/**"
              - "packages/waffle/scripts/build-memory-group-fixture.ts"
      - name: Resolve selected CI checks
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PATHS_OUTCOME: ${{ steps.paths.outcome }}
          P_NETWORK: ${{ steps.paths.outputs.network }}
          P_BROWSER: ${{ steps.paths.outputs.browser }}
          P_LIBC: ${{ steps.paths.outputs.libc }}
          P_PROGRAMS: ${{ steps.paths.outputs.programs }}
          P_COREUTILS: ${{ steps.paths.outputs.coreutils }}
          P_CHECKSUMS: ${{ steps.paths.outputs.checksums }}
          P_FINDUTILS: ${{ steps.paths.outputs.findutils }}
          P_DIFFUTILS: ${{ steps.paths.outputs.diffutils }}
          P_GH: ${{ steps.paths.outputs.gh }}
          P_JQ: ${{ steps.paths.outputs.jq }}
          P_CURL: ${{ steps.paths.outputs.curl }}
          P_AWK: ${{ steps.paths.outputs.awk }}
          P_TAR: ${{ steps.paths.outputs.tar }}
          P_PROCPS: ${{ steps.paths.outputs.procps }}
        run: |
          set -euo pipefail
          fallback=false
          if [[ "$EVENT_NAME" == workflow_dispatch || "$PATHS_OUTCOME" != success ]]; then
            fallback=true
          fi
          pick() { [[ "$fallback" == true || "$1" == true ]] && echo true || echo false; }
          network=$(pick "$P_NETWORK")
          browser=$([[ "$fallback" == true || "$P_BROWSER" != false ]] && echo true || echo false)
          libc=$(pick "$P_LIBC")
          programs=$(pick "$P_PROGRAMS")
          coreutils=$(pick "$P_COREUTILS")
          checksums=$(pick "$P_CHECKSUMS")
          findutils=$(pick "$P_FINDUTILS")
          diffutils=$(pick "$P_DIFFUTILS")
          gh=$(pick "$P_GH")
          jq=$(pick "$P_JQ")
          curl=$(pick "$P_CURL")
          awk=$(pick "$P_AWK")
          tar=$(pick "$P_TAR")
          procps=$(pick "$P_PROCPS")
          any() { for v in "$@"; do [[ "$v" == true ]] && { echo true; return; }; done; echo false; }
          libc_or_browser=$(any "$libc" "$browser")
          xargs_or_echo=$(any "$findutils" "$coreutils")
          need_wasi_sdk=$(any "$awk" "$diffutils" "$jq" "$tar" "$xargs_or_echo" "$checksums")
          need_wasmtime=$(any "$awk" "$diffutils" "$jq" "$tar")
          need_optimizer=$(any "$programs" "$awk" "$diffutils" "$jq" "$tar" "$xargs_or_echo" "$checksums")
          need_rust_wasip1=$(any "$programs" "$jq" "$tar" "$xargs_or_echo" "$checksums")
          need_wasi_libc=$(any "$awk" "$diffutils" "$jq" "$tar" "$xargs_or_echo" "$checksums")
          {
            echo "network=$network"
            echo "browser=$browser"
            echo "libc=$libc"
            echo "libc_or_browser=$libc_or_browser"
            echo "programs=$programs"
            echo "coreutils=$coreutils"
            echo "checksums=$checksums"
            echo "findutils=$findutils"
            echo "xargs_or_echo=$xargs_or_echo"
            echo "diffutils=$diffutils"
            echo "gh=$gh"
            echo "jq=$jq"
            echo "curl=$curl"
            echo "awk=$awk"
            echo "tar=$tar"
            echo "procps=$procps"
            echo "need_wasi_sdk=$need_wasi_sdk"
            echo "need_wasmtime=$need_wasmtime"
            echo "need_optimizer=$need_optimizer"
            echo "need_rust_wasip1=$need_rust_wasip1"
            echo "need_wasi_libc=$need_wasi_libc"
          } | tee -a "$GITHUB_OUTPUT"
      - uses: ./.github/actions/release-downloads
      - uses: ./.github/actions/setup-tools
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: "26.12.1"
      - name: Cache Bun package downloads
        id: bun-cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-pm-v2-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
      - name: Install site dependencies
        id: site-install
        continue-on-error: true
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Build the site
        id: site-build
        if: steps.site-install.outcome == 'success'
        continue-on-error: true
        working-directory: site
        run: bun run build
      - name: Type-check the site
        id: site-typecheck
        if: steps.site-install.outcome == 'success'
        continue-on-error: true
        working-directory: site
        run: bun run typecheck
      - uses: actions/cache@v4
        id: network-artifact
        with:
          path: |
            packages/waffle/browser/net/network.wasm
            packages/waffle/browser/net/network.input-hash
            packages/waffle/browser/net/network.sha256
            packages/waffle/browser/net/network.buffer.js
            packages/waffle/browser/net/network.buffer.sha256
            packages/waffle/browser/net/network.growth.json
          key: network-wasm-v2-${{ hashFiles('packages/waffle/Cargo.toml', 'packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml', 'packages/waffle/network/Cargo.toml', 'packages/waffle/network/src/**', 'packages/waffle/tooling/build-network.ts', 'packages/waffle/tooling/network-translator.ts', 'packages/waffle/tooling/network-translator/**', 'packages/waffle/tooling/network-growth.ts') }}
      - name: Cache pinned network translator
        if: steps.network-artifact.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        id: translator-cache
        with:
          path: .network-tools
          key: network-translator-v1-${{ hashFiles('packages/waffle/tooling/network-translator.ts', 'packages/waffle/tooling/network-translator/**') }}
      - name: Cache Rust toolchain and Cargo build inputs
        if: steps.network-artifact.outputs.cache-hit != 'true' || steps.select.outputs.network == 'true'
        uses: actions/cache@v4
        id: rust-cache
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            packages/waffle/target
          key: ${{ runner.os }}-${{ runner.arch }}-network-rust-${{ hashFiles('packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml') }}-${{ hashFiles('packages/waffle/network/**/*.rs') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-network-rust-${{ hashFiles('packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml') }}-
      - uses: dtolnay/rust-toolchain@stable
        if: steps.network-artifact.outputs.cache-hit != 'true' || steps.select.outputs.network == 'true'
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - name: Build exact-input network artifact once
        if: steps.network-artifact.outputs.cache-hit != 'true'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/waffle/target
          WAFFLE_TOOL_CACHE: ${{ github.workspace }}/.network-tools
        run: bun run --cwd packages/waffle build:network
      - name: Rust native, state and actual WASM tests
        if: steps.network-artifact.outputs.cache-hit != 'true' || steps.select.outputs.network == 'true'
        working-directory: packages/waffle
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/waffle/target
          WAFFLE_TOOL_CACHE: ${{ github.workspace }}/.network-tools
          WAFFLE_TCP_MODULE: ${{ github.workspace }}/packages/waffle/browser/net/network.wasm
        run: |
          bun tooling/check-network-rust.ts
          cargo fmt --all -- --check
          cargo clippy --release --all-targets --features module-tests --locked -- -D warnings
          cargo test --release -p waffle-tcp --features module-tests --locked -- --nocapture
      - name: Verify network compiler lifecycle and raw source installation
        if: steps.network-artifact.outputs.cache-hit != 'true' || steps.select.outputs.network == 'true'
        working-directory: packages/waffle
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/waffle/target
          WAFFLE_TOOL_CACHE: ${{ github.workspace }}/.network-tools
        run: |
          bun test tooling/network-translator.test.ts
          bun tooling/network-source-smoke.ts
      - name: Verify exact-input network artifact before installation
        run: |
          bun run --cwd packages/waffle tooling/build-network.ts --verify
          echo 'WAFFLE_NETWORK_PREBUILT=1' >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Cache standard native relay prebuild downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm/_prebuilds
          key: ${{ runner.os }}-${{ runner.arch }}-relay-prebuild-v1-${{ hashFiles('bun.lock', 'packages/waffle-relay/package.json', 'packages/waffle-relay/scripts/prepare-native.ts', 'packages/waffle-relay/src/webtransport-integrity.ts') }}
      - name: Prepare and verify the required native relay prebuild
        run: bun packages/waffle-relay/scripts/prepare-native.ts
      - run: bun run prepare:package
      - name: Prepare the trusted Bun adapter without rerunning native install scripts
        run: bun run --cwd packages/git/node_modules/bun-wasm prepare
      - name: Check native preparation tooling
        run: |
          packages/waffle/node_modules/.bin/oxlint --config packages/waffle/.oxlintrc.json --deny-warnings packages/waffle-relay/scripts/prepare-native.ts packages/waffle-relay/tests/prepare-native.test.ts
          packages/waffle/node_modules/.bin/oxfmt --check --config packages/waffle/.oxfmtrc.json packages/waffle-relay/scripts/prepare-native.ts packages/waffle-relay/tests/prepare-native.test.ts
      - name: Fetch PR base ref for baseline checks
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
      - run: bun run --cwd packages/waffle quality
      - run: bun run relay:check
      - name: Prepare pinned ledger-free allocation reference
        run: bun packages/waffle/tooling/prepare-allocation-reference.ts
      - run: bun run test --parallel=2 && bun run test:ci
      - run: bun run size && bun run size:network && bun run size:gpu
      - run: bun run pack
      - uses: actions/upload-artifact@v4
        with:
          name: waffle-runtime-tarball-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/waffle/dist/*.tgz
          if-no-files-found: error
          retention-days: 7
      - run: bun run pack:check
        env:
          TMPDIR: ${{ runner.temp }}
      - run: test -z "$(git ls-files packages/waffle/dist)"

      # Shared native toolchains, restored at most once per run.
      - uses: actions/cache@v4
        id: sdk
        if: steps.select.outputs.need_wasi_sdk == 'true'
        with:
          path: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          key: ${{ runner.os }}-wasi-sdk-34-b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
      - name: Install pinned wasi-sdk 34
        if: steps.select.outputs.need_wasi_sdk == 'true' && steps.sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/tools/ci-release-download.ts" https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz wasi-sdk.tar.gz 300000
          printf '%s  %s\n' b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4 wasi-sdk.tar.gz | sha256sum --check --status
          tar -xzf wasi-sdk.tar.gz
          rm wasi-sdk.tar.gz
      - uses: actions/cache@v4
        id: wasmtime
        if: steps.select.outputs.need_wasmtime == 'true'
        with:
          path: ~/downloader/bin/wasmtime
          key: ${{ runner.os }}-wasmtime-49.0.3
      - uses: ./.github/actions/setup-wasmtime
        if: steps.select.outputs.need_wasmtime == 'true' && steps.wasmtime.outputs.cache-hit != 'true'
      - name: Add cached Wasmtime to PATH
        if: steps.select.outputs.need_wasmtime == 'true'
        run: |
          echo "$HOME/downloader/bin" >> "$GITHUB_PATH"
          "$HOME/downloader/bin/wasmtime" --version
      - uses: ./.github/actions/program-optimizer
        if: steps.select.outputs.need_optimizer == 'true'
      - name: Cache shared Rust toolchain and Cargo downloads
        id: shared-rust-cache
        if: steps.select.outputs.need_rust_wasip1 == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-shared-rust-1.98.1-p1-true-thr-false-v1-${{ hashFiles('Cargo.lock', 'packages/coreutils/crates/checksums/Cargo.lock', 'packages/tar/producer/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-shared-rust-1.98.1-p1-true-thr-false-v1-
            ${{ runner.os }}-${{ runner.arch }}-shared-rust-1.98.1-p1-true-thr-true-v1-
            ${{ runner.os }}-${{ runner.arch }}-shared-rust-1.98.1-
      - uses: dtolnay/rust-toolchain@stable
        if: steps.select.outputs.need_rust_wasip1 == 'true'
        with:
          toolchain: 1.98.1
          targets: wasm32-wasip1
          components: rustfmt
      - name: Cache singular patched libc for guest programs
        id: wasi-libc-cache
        if: steps.select.outputs.need_wasi_libc == 'true'
        uses: actions/cache@v4
        with:
          path: .build/wasi-libc
          key: wasi-libc-34.0-runner-temp-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/program-build-tools.ts', 'tools/program-optimize.ts', 'tools/program-derivation.ts', 'packages/waffle/scripts/build-wasi-libc.sh', 'packages/waffle/patches/wasi-libc/preopen-scan.patch') }}

      # Programs checks (each gated by its exact path filter).
      - name: Fetch locked Cargo sources for selected program checks
        if: steps.select.outputs.programs == 'true' || steps.select.outputs.checksums == 'true'
        run: cargo fetch --locked
      - name: Cache programs Cargo target
        if: steps.select.outputs.programs == 'true'
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-programs-target-${{ hashFiles('bun.lock', 'Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('packages/**/*.rs', 'tools/program-build-tools.ts', 'tools/program-optimize.ts', 'tools/program-derivation.ts', 'tools/program-locales/**') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-programs-target-${{ hashFiles('bun.lock', 'Cargo.lock', 'rust-toolchain.toml') }}-
      - uses: ./.github/actions/rust-build-cache
        if: steps.select.outputs.programs == 'true'
      - name: Run shared program checks
        if: steps.select.outputs.programs == 'true'
        run: |
          bun run programs:check
          bun run --cwd packages/git test:unit
          bun run --cwd packages/waffle tsc -p ../../scripts/tsconfig.json
          bun run programs:tools
          bun test scripts/program-release.test.ts scripts/program-rebind.test.ts scripts/host-interface.test.ts
          bun run programs:routes
          bun run programs:source
      - name: Record exact GNU date source and native compiler identity
        if: steps.select.outputs.programs == 'true' && steps.select.outputs.coreutils == 'true'
        id: gnu-date-identity
        run: |
          set -euo pipefail
          identity=$(node packages/coreutils/scripts/build-native-date-oracle.ts --identity)
          printf 'identity=%s\n' "$identity" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.select.outputs.programs == 'true' && steps.select.outputs.coreutils == 'true'
        id: gnu-date-native
        with:
          path: .build/gnu-date-native-oracle
          key: ${{ runner.os }}-${{ runner.arch }}-gnu-date-9.12-v1-${{ steps.gnu-date-identity.outputs.identity }}
      - name: Build or verify only the pinned GNU date native oracle
        if: steps.select.outputs.programs == 'true' && steps.select.outputs.coreutils == 'true'
        env:
          GNU_DATE_ORACLE_ROOT: ${{ github.workspace }}/.build/gnu-date-native-oracle
          GNU_DATE_ORACLE_SCRATCH_ROOT: ${{ runner.temp }}
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE" "$GNU_DATE_ORACLE_SCRATCH_ROOT"
          bash packages/coreutils/scripts/provision-native-date.sh
          node packages/coreutils/scripts/build-native-date-oracle.ts --verify-only
          printf 'GNU_DATE=%s/date\n' "$GNU_DATE_ORACLE_ROOT" >> "$GITHUB_ENV"
          printf 'GNU_DATE_ORACLE_ROOT=%s\n' "$GNU_DATE_ORACLE_ROOT" >> "$GITHUB_ENV"
      - name: Verify date source against the pinned native GNU oracle
        if: steps.select.outputs.programs == 'true' && steps.select.outputs.coreutils == 'true'
        run: node --disable-warning=ExperimentalWarning --test packages/coreutils/scripts/date-source.test.ts
      - name: Run python and Rust program unit checks
        if: steps.select.outputs.programs == 'true'
        run: |
          bun run --cwd packages/python test:composition
          bun run --cwd packages/python test:build
          bun run --cwd packages/python test:unit
          cargo fmt --all -- --check
      - name: Run native Rust program tests
        if: steps.select.outputs.programs == 'true'
        run: bash scripts/with-build-cache.sh cargo test --locked -p waffle-program-support -p waffle-process-consumer -p waffle-coreutils -p waffle-clear -p waffle-cut -p waffle-tr -p waffle-wc -p waffle-grep -p waffle-findutils-source -p upstream-xargs -p waffle-echo -p waffle-date
      - name: Verify the cached WASI root preopen
        if: steps.select.outputs.programs == 'true'
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node ../../scripts/program-support-wasi-runner.ts
          RUSTFLAGS: -C link-arg=--max-memory=268435456 -C link-arg=--demangle
        run: bash scripts/with-build-cache.sh cargo test --locked --release -p waffle-program-support --features cooperative-wasi --target wasm32-wasip1 --test wasi_root_preopen

      # procps
      - name: Run procps checks
        if: steps.select.outputs.procps == 'true'
        run: |
          ln -sfn "$GITHUB_WORKSPACE/packages/waffle/node_modules/@types" packages/procps/node_modules/@types
          PATH="$GITHUB_WORKSPACE/packages/waffle/node_modules/.bin:$PATH" bun run programs:procps
      - name: Lint procps
        if: steps.select.outputs.procps == 'true'
        working-directory: packages/procps
        run: ../waffle/node_modules/.bin/oxlint --config ../waffle/.oxlintrc.json --deny-warnings --report-unused-disable-directives src tests scripts
      - name: Check procps formatting
        if: steps.select.outputs.procps == 'true'
        working-directory: packages/procps
        run: ../waffle/node_modules/.bin/oxfmt --check --config ../waffle/.oxfmtrc.json src tests scripts docs provenance package.json tsconfig.json

      # gh
      - name: Run gh checks
        if: steps.select.outputs.gh == 'true'
        run: bun run programs:gh

      # curl
      - name: Record the actual hosted runner image for native curl cache isolation
        if: steps.select.outputs.curl == 'true'
        id: curl-image
        run: |
          test -n "$ImageOS"
          test -n "$ImageVersion"
          printf 'identity=%s-%s\n' "$ImageOS" "$ImageVersion" >> "$GITHUB_OUTPUT"
          printf 'NATIVE_CURL_CACHE=%s/curl-native-cache\nCURL_NATIVE_SCRATCH_ROOT=%s/curl-native-scratch\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Compute native curl oracle source, recipe and compiler identity
        if: steps.select.outputs.curl == 'true'
        id: curl-native-key
        run: bun packages/curl/scripts/native-oracle.ts key
      - uses: actions/cache/restore@v4
        if: steps.select.outputs.curl == 'true'
        id: curl-native
        with:
          path: ${{ steps.curl-native-key.outputs.directory }}
          key: ${{ steps.curl-native-key.outputs.key }}-${{ steps.curl-image.outputs.identity }}
      - name: Provision native curl oracle
        if: steps.select.outputs.curl == 'true'
        run: bun packages/curl/scripts/native-oracle.ts provision
      - name: Run curl gate
        if: steps.select.outputs.curl == 'true'
        run: bun run programs:curl
      - name: Save only a validated curl oracle after the curl gate passes
        if: steps.select.outputs.curl == 'true' && steps.curl-native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.curl-native-key.outputs.directory }}
          key: ${{ steps.curl-native-key.outputs.key }}-${{ steps.curl-image.outputs.identity }}
      - name: Remove native curl build scratch
        if: always() && steps.select.outputs.curl == 'true'
        env:
          CURL_NATIVE_SCRATCH_ROOT: ${{ runner.temp }}/curl-native-scratch
        run: |
          bun -e 'import { rmSync } from "node:fs"; const p=process.env.CURL_NATIVE_SCRATCH_ROOT; if (!p || p !== `${process.env.RUNNER_TEMP}/curl-native-scratch`) throw Error("Unexpected scratch path"); rmSync(p, { recursive: true, force: true });'

      # awk
      - uses: ./.github/actions/ubuntu-main-archive
        if: steps.select.outputs.awk == 'true'
      - name: Install awk build dependencies
        if: steps.select.outputs.awk == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bison ninja-build
      - name: Build and qualify only awk
        if: steps.select.outputs.awk == 'true'
        run: bun run programs:awk
        env:
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          WASI_LIBC_SCRATCH_ROOT: ${{ runner.temp }}
          AWK_SCRATCH_ROOT: ${{ runner.temp }}

      # diffutils
      - name: Record native compiler identity
        if: steps.select.outputs.diffutils == 'true'
        id: native-compiler
        run: |
          set -eu
          identity=$(
            {
              cc -dumpmachine
              cc --version | sed -n '1p'
            } | sha256sum | cut -d' ' -f1
          )
          printf 'identity=%s\n' "$identity" >> "$GITHUB_OUTPUT"
          printf 'native compiler identity: %s\n' "$identity"
      - uses: actions/cache@v4
        if: steps.select.outputs.diffutils == 'true'
        id: native-oracle
        with:
          path: .build/diffutils-native-oracle
          key: ${{ runner.os }}-${{ runner.arch }}-program-diffutils-native-oracle-v1-gnu-3.12-${{ hashFiles('packages/diffutils/sources.lock.json', 'packages/diffutils/scripts/build-native-oracle.ts') }}-${{ steps.native-compiler.outputs.identity }}
      - name: Build or verify native GNU diffutils oracle
        if: steps.select.outputs.diffutils == 'true'
        run: bun run --cwd packages/diffutils native-oracle
        env:
          NATIVE_ORACLE_COMPILER_IDENTITY: ${{ steps.native-compiler.outputs.identity }}
      - uses: actions/cache@v4
        if: steps.select.outputs.diffutils == 'true'
        id: diffutils-cache
        with:
          path: |
            packages/diffutils/.build
            packages/diffutils/.sources
          key: ${{ runner.os }}-${{ runner.arch }}-program-diffutils-v2-${{ hashFiles('packages/diffutils/sources.lock.json', 'packages/diffutils/patches/**', 'packages/diffutils/scripts/**', 'packages/diffutils/src/**', 'packages/diffutils/tests/**', 'packages/waffle/scripts/build-wasi-libc.sh', 'packages/waffle/patches/wasi-libc/**', 'tools/program-build-tools.ts', 'tools/program-package.ts') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-program-diffutils-v2-
      - name: Check program types before diffutils when programs did not run
        if: steps.select.outputs.diffutils == 'true' && steps.select.outputs.programs != 'true'
        run: bun run programs:check
      - name: Build and test diffutils
        if: steps.select.outputs.diffutils == 'true'
        run: |
          cmake --version
          ninja --version
          bun run programs:diffutils
        env:
          GNU_DIFF: ${{ github.workspace }}/.build/diffutils-native-oracle/diff
          GNU_CMP: ${{ github.workspace }}/.build/diffutils-native-oracle/cmp
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          WASI_LIBC_SCRATCH_ROOT: ${{ runner.temp }}

      # jq
      - uses: actions/cache@v4
        if: steps.select.outputs.jq == 'true'
        id: jq-cache
        with:
          path: |
            .build/jq
            packages/jq/.build
            packages/jq/.sources
          key: ${{ runner.os }}-${{ runner.arch }}-program-jq-v2-${{ hashFiles('bun.lock', 'rust-toolchain.toml', 'packages/jq/sources.lock.json', 'packages/jq/patches/**', 'packages/jq/scripts/**', 'packages/jq/src/**', 'packages/jq/tests/**', 'packages/waffle/scripts/build-wasi-libc.sh', 'packages/waffle/patches/wasi-libc/**', 'tools/program-build-tools.ts', 'tools/program-package.ts') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-program-jq-v2-
      - uses: actions/cache@v4
        if: steps.select.outputs.jq == 'true'
        id: jq-native
        with:
          path: ${{ runner.temp }}/jq-native
          key: ${{ runner.os }}-${{ runner.arch }}-jq-native-1.8.2-x86_64-b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f
      - name: Download pinned jq native oracle
        if: steps.select.outputs.jq == 'true' && steps.jq-native.outputs.cache-hit != 'true'
        env:
          JQ_NATIVE_DIR: ${{ runner.temp }}/jq-native
          JQ_NATIVE_URL: https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64
        run: |
          mkdir -p "$JQ_NATIVE_DIR"
          node "$GITHUB_WORKSPACE/tools/ci-release-download.ts" "$JQ_NATIVE_URL" "$JQ_NATIVE_DIR/jq"
      - name: Check program types before jq when not already checked
        if: steps.select.outputs.jq == 'true' && steps.select.outputs.programs != 'true' && steps.select.outputs.diffutils != 'true'
        run: bun run programs:check
      - name: Verify pinned jq native oracle and run jq checks
        if: steps.select.outputs.jq == 'true'
        env:
          JQ_NATIVE_DIR: ${{ runner.temp }}/jq-native
          JQ_NATIVE_SHA256: b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          WASI_LIBC_SCRATCH_ROOT: ${{ runner.temp }}
        run: |
          set -euo pipefail
          test -f "$JQ_NATIVE_DIR/jq"
          echo "$JQ_NATIVE_SHA256  $JQ_NATIVE_DIR/jq" | sha256sum -c -
          chmod 700 "$JQ_NATIVE_DIR/jq"
          export PATH="$JQ_NATIVE_DIR:$PATH"
          test "$(command -v jq)" = "$JQ_NATIVE_DIR/jq"
          test "$(jq --version)" = "jq-1.8.2"
          cmake --version
          ninja --version
          bun run programs:jq

      # tar
      - name: Set run-owned tar scratch root
        if: steps.select.outputs.tar == 'true'
        run: printf 'TAR_SCRATCH_ROOT=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: steps.select.outputs.tar == 'true'
        id: tar-cache
        with:
          path: |
            packages/tar/.build
            packages/tar/.sources
          key: ${{ runner.os }}-${{ runner.arch }}-program-tar-v2-${{ hashFiles('bun.lock', 'rust-toolchain.toml', 'packages/tar/sources.lock.json', 'packages/tar/producer/**', 'packages/tar/patches/**', 'packages/tar/scripts/**', 'packages/tar/src/**', 'packages/tar/tests/**', 'packages/waffle/scripts/build-wasi-libc.sh', 'packages/waffle/patches/wasi-libc/**', 'tools/program-build-tools.ts', 'tools/program-package.ts') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-program-tar-v2-
      - name: Build and verify tar
        if: steps.select.outputs.tar == 'true'
        env:
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          WASI_LIBC_SCRATCH_ROOT: ${{ runner.temp }}
        run: |
          cmake --version
          ninja --version
          node packages/tar/scripts/build-tar.ts --prepare
          cargo fetch --locked --manifest-path packages/tar/producer/Cargo.toml
          node packages/tar/scripts/build-tar.ts --native
          node packages/tar/scripts/build-tar.ts
          node packages/tar/scripts/test-native.ts
          TAR_CHECK_ARTIFACTS=1 node --test packages/tar/tests/source.test.ts
          bun run --cwd packages/tar typecheck
          node tools/program-package.ts pack packages/tar
          TAR_PACKAGE_ARCHIVE="$PWD/packages/tar/.build/waffle-os-tar-0.0.0.tgz" bun test packages/tar/tests/tar-wasi.test.ts

      # findutils-xargs and coreutils-echo (direct same-runner handoff without artifact round-trip)
      - name: Cache xargs and echo build outputs
        if: steps.select.outputs.xargs_or_echo == 'true'
        id: xargs-echo-cache
        uses: actions/cache@v4
        with:
          path: |
            .build/findutils
            .build/coreutils
            .build/program-locales
          key: ${{ runner.os }}-${{ runner.arch }}-xargs-echo-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'tools/program-build-tools.ts', 'tools/program-optimize.ts', 'tools/program-derivation.ts', 'tools/program-locales/**', 'packages/waffle/scripts/build-wasi-libc.sh', 'packages/waffle/patches/wasi-libc/preopen-scan.patch') }}-${{ hashFiles('packages/findutils/**/*.rs', 'packages/findutils/**/Cargo.toml', 'packages/coreutils/crates/echo/**', 'packages/process-consumer/**', 'packages/program-support/src/**/*.rs', 'packages/program-support/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-xargs-echo-v1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'tools/program-build-tools.ts', 'tools/program-optimize.ts', 'tools/program-derivation.ts', 'tools/program-locales/**', 'packages/waffle/scripts/build-wasi-libc.sh', 'packages/waffle/patches/wasi-libc/preopen-scan.patch') }}-
      - name: Build and qualify findutils xargs
        if: steps.select.outputs.xargs_or_echo == 'true'
        env:
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          WASI_LIBC_SCRATCH_ROOT: ${{ runner.temp }}
          WASI_LIBC_JOBS: "4"
        run: |
          bun run --cwd packages/findutils test:types
          bun run --cwd packages/findutils build:xargs
          bun packages/findutils/scripts/xargs-artifact.ts .build/xargs-process-input
      - name: Run findutils xargs WASI suite
        if: steps.select.outputs.findutils == 'true'
        env:
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          WASI_LIBC_SCRATCH_ROOT: ${{ runner.temp }}
        run: bun run --cwd packages/findutils test:xargs:wasi
      - name: Build and qualify coreutils echo with the same-run xargs artifact
        if: steps.select.outputs.coreutils == 'true'
        env:
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          WASI_LIBC_SCRATCH_ROOT: ${{ runner.temp }}
          WASI_LIBC_JOBS: "4"
          ECHO_XARGS_ARTIFACT: ${{ github.workspace }}/.build/xargs-process-input
        run: |
          bun run --cwd packages/coreutils test:echo:types
          bun run --cwd packages/coreutils build:echo
          bun run --cwd packages/coreutils test:echo:wasi
          bun packages/coreutils/scripts/echo-artifact.ts
      - uses: actions/upload-artifact@v4
        if: steps.select.outputs.coreutils == 'true'
        with:
          name: echo-process-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/echo-artifact
          if-no-files-found: error
          retention-days: 7

      # coreutils-checksums
      - uses: actions/cache@v4
        if: steps.select.outputs.checksums == 'true'
        id: checksum-cache
        with:
          path: |
            .build/coreutils-checksums
            .build/program-locales
            packages/coreutils/.sources
          key: ${{ runner.os }}-${{ runner.arch }}-program-coreutils-checksums-v2-${{ hashFiles('bun.lock', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'packages/coreutils/crates/checksums/Cargo.toml', 'packages/coreutils/crates/checksums/Cargo.lock', 'packages/coreutils/crates/checksums/**/*.rs', 'packages/coreutils/crates/checksums/patches/**', 'packages/coreutils/scripts/build-checksums.ts', 'packages/coreutils/scripts/build-config.ts', 'packages/coreutils/scripts/build-family.ts', 'packages/coreutils/scripts/checksum-artifact.ts', 'packages/coreutils/scripts/prepare-checksum-source.ts', 'packages/coreutils/scripts/programs.ts', 'tools/program-build-tools.ts', 'tools/program-optimize.ts', 'tools/program-derivation.ts', 'tools/program-locales/**', 'packages/waffle/scripts/build-wasi-libc.sh', 'packages/waffle/patches/wasi-libc/**') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-program-coreutils-checksums-v2-
      - name: Discard a generated source restored from a different checksum recipe
        if: steps.select.outputs.checksums == 'true' && steps.checksum-cache.outputs.cache-hit != 'true'
        run: rm -rf packages/coreutils/.sources/checksums
      - name: Identify the pinned GNU checksum source and native toolchain
        if: steps.select.outputs.checksums == 'true'
        id: checksum-oracle-identity
        run: |
          set -euo pipefail
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "key=$(node packages/coreutils/scripts/build-native-checksum-oracle.ts --identity)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.select.outputs.checksums == 'true'
        id: checksum-native-oracle
        with:
          path: .build/gnu-checksum-native-oracle
          key: ${{ runner.os }}-${{ runner.arch }}-gnu-checksum-native-v1-${{ steps.checksum-oracle-identity.outputs.image }}-${{ steps.checksum-oracle-identity.outputs.key }}
      - name: Build the nine native GNU oracle programs on cache miss
        if: steps.select.outputs.checksums == 'true' && steps.checksum-native-oracle.outputs.cache-hit != 'true'
        run: node packages/coreutils/scripts/build-native-checksum-oracle.ts
        env:
          GNU_CHECKSUM_ORACLE_ROOT: ${{ github.workspace }}/.build/gnu-checksum-native-oracle
          GNU_CHECKSUM_ORACLE_SCRATCH_ROOT: ${{ runner.temp }}
      - name: Verify the pinned GNU 9.12 checksum oracle
        if: steps.select.outputs.checksums == 'true'
        env:
          GNU_CHECKSUM_ORACLE_ROOT: ${{ github.workspace }}/.build/gnu-checksum-native-oracle
        run: node packages/coreutils/scripts/build-native-checksum-oracle.ts --verify-only
      - name: Build the nine checksum guests once through the existing leaf route
        if: steps.select.outputs.checksums == 'true'
        run: bun run --cwd packages/coreutils build:checksums
        env:
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
          WASI_LIBC_SCRATCH_ROOT: ${{ runner.temp }}
          WASI_LIBC_JOBS: "4"
      - name: Read back the exact admitted checksum guests
        if: steps.select.outputs.checksums == 'true'
        run: node packages/coreutils/scripts/checksum-artifact.ts "$GITHUB_WORKSPACE/.build/checksum-artifact"
        env:
          WASI_SDK_PATH: ${{ runner.temp }}/wasi-sdk-34.0-x86_64-linux
      - name: Run checksum runtime acceptance against the admitted bytes
        if: steps.select.outputs.checksums == 'true'
        run: bun run --cwd packages/coreutils test:checksums:wasi
        env:
          GNU_CHECKSUM_ORACLE_ROOT: ${{ github.workspace }}/.build/gnu-checksum-native-oracle
          CHECKSUM_ARTIFACTS: ${{ github.workspace }}/.build/checksum-artifact
      - name: Retain the exact checksum-only producer closure
        if: steps.select.outputs.checksums == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: checksum-producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/checksum-artifact
            .build/gnu-checksum-native-oracle/metadata.json
          if-no-files-found: error
          retention-days: 7

      - name: Require successful change detection and site checks
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
        env:
          PATHS_RESULT: ${{ steps.paths.outcome }}
          SITE_BUILD: ${{ steps.site-build.outcome }}
          SITE_TYPECHECK: ${{ steps.site-typecheck.outcome }}
        run: |
          if [[ "$PATHS_RESULT" != success ]]; then
            echo '::error::Complete CI requires successful change detection.'
            exit 1
          fi
          if [[ "$SITE_BUILD" != success || "$SITE_TYPECHECK" != success ]]; then
            echo '::error::Complete CI requires a successful site build and site typecheck.'
            exit 1
          fi
      - uses: ./.github/actions/save-release-downloads
        if: always() && env.CI_RELEASE_CACHE_INITIAL != ''

  browser:
    name: Browser and libc
    # Playwright 1.64.1 browsers are proven on Ubuntu 24.04; move the pin deliberately with a green run.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: paths
        continue-on-error: true
        with:
          base: ${{ github.ref }}
          filters: |
            browser:
              - ".github/workflows/ci.yml"
              - ".github/workflows/threads-fixture.yml"
              - ".github/actions/release-downloads/**"
              - ".github/actions/save-release-downloads/**"
              - ".github/actions/setup-tools/**"
              - "tools/ci-*.ts"
              - "packages/waffle/Cargo.toml"
              - "packages/waffle/Cargo.lock"
              - "packages/waffle/rust-toolchain.toml"
              - "packages/waffle/network/**"
              - "packages/waffle/tooling/build-network.ts"
              - "packages/waffle/tooling/network-translator.ts"
              - "packages/waffle/tooling/network-translator.test.ts"
              - "packages/waffle/tooling/network-source-smoke.ts"
              - "packages/waffle/tooling/network-translator/**"
              - "packages/waffle/tooling/network-growth.ts"
              - "packages/waffle/tooling/check-network-rust.ts"
              - "packages/waffle/build.ts"
              - "packages/waffle/prepare.ts"
              - "packages/waffle/core/**"
              - "packages/waffle/fs/**"
              - "packages/waffle/proc/**"
              - "packages/waffle/interrupt/**"
              - "packages/waffle/thread/**"
              - "packages/waffle/memory/**"
              - "packages/waffle/browser/**"
              - "packages/waffle/search/**"
              - "packages/waffle/group/**"
              - "packages/waffle/link/**"
              - "packages/waffle/runtime.ts"
              - "packages/waffle/index.ts"
              - "package.json"
              - "packages/waffle/package.json"
              - "bun.lock"
              - "rust-toolchain.toml"
              - "packages/waffle/scripts/build-thread-fixture.ts"
              - "packages/waffle/scripts/threads-fixture-producer.test.ts"
              - "packages/waffle/scripts/build-memory-group-fixture.ts"
              - "packages/waffle/scripts/build-gpu-fixture.ts"
              - "packages/waffle/scripts/test-browser.ts"
              - "packages/waffle/scripts/browser-command.ts"
              - "packages/waffle/scripts/browser-supervisor.ts"
              - "packages/waffle/scripts/owned-command.ts"
              - "packages/waffle-relay/scripts/prepare-native.ts"
              - "packages/waffle-relay/tests/prepare-native.test.ts"
              - "packages/waffle-relay/src/**"
              - "packages/waffle-relay/package.json"
              - "packages/waffle/tooling/workspace-safari-runner.ts"
              - "packages/waffle/tests/**"
              - "packages/waffle/testing/**"
            libc:
              - ".github/actions/setup-wasmtime/**"
              - ".github/workflows/ci.yml"
              - ".github/actions/release-downloads/**"
              - ".github/actions/save-release-downloads/**"
              - ".github/actions/setup-tools/**"
              - "tools/ci-*.ts"
              - "packages/waffle/patches/**"
              - "packages/waffle/scripts/build-wasi-libc.sh"
              - "packages/waffle/scripts/test-wasi-libc.ts"
              - "packages/waffle/scripts/owned-command.ts"
              - "packages/waffle/core/**"
              - "packages/waffle/fs/**"
              - "packages/waffle/proc/**"
              - "packages/waffle/interrupt/**"
              - "packages/waffle/browser/**"
              - "packages/waffle/runtime.ts"
              - "packages/waffle/index.ts"
              - "package.json"
              - "packages/waffle/package.json"
              - "bun.lock"
              - "packages/waffle/tests/wasi-libc.test.ts"
              - "packages/waffle/tests/preview1-socket-libc.test.ts"
              - "packages/waffle/tests/preview1-socket-support.ts"
              - "packages/waffle/tests/fixtures/**"
              - "packages/waffle/scripts/build-memory-group-fixture.ts"
      - name: Resolve browser and libc checks
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PATHS_OUTCOME: ${{ steps.paths.outcome }}
          P_BROWSER: ${{ steps.paths.outputs.browser }}
          P_LIBC: ${{ steps.paths.outputs.libc }}
        run: |
          set -euo pipefail
          fallback=false
          if [[ "$EVENT_NAME" == workflow_dispatch || "$PATHS_OUTCOME" != success ]]; then
            fallback=true
          fi
          browser=$([[ "$fallback" == true || "$P_BROWSER" != false ]] && echo true || echo false)
          libc=$([[ "$fallback" == true || "$P_LIBC" == true ]] && echo true || echo false)
          libc_or_browser=$([[ "$libc" == true || "$browser" == true ]] && echo true || echo false)
          {
            echo "browser=$browser"
            echo "libc=$libc"
            echo "libc_or_browser=$libc_or_browser"
            echo "need_wasi_sdk=$libc_or_browser"
          } | tee -a "$GITHUB_OUTPUT"
      - uses: ./.github/actions/release-downloads
        if: steps.select.outputs.libc_or_browser == 'true'
      - uses: ./.github/actions/setup-tools
        if: steps.select.outputs.libc_or_browser == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: "26.12.1"
      - name: Restore Bun package downloads
        if: steps.select.outputs.libc_or_browser == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-pm-v2-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'site/bun.lock') }}
      - uses: actions/cache/restore@v4
        id: network-artifact
        if: steps.select.outputs.libc_or_browser == 'true'
        with:
          path: |
            packages/waffle/browser/net/network.wasm
            packages/waffle/browser/net/network.input-hash
            packages/waffle/browser/net/network.sha256
            packages/waffle/browser/net/network.buffer.js
            packages/waffle/browser/net/network.buffer.sha256
            packages/waffle/browser/net/network.growth.json
          key: network-wasm-v2-${{ hashFiles('packages/waffle/Cargo.toml', 'packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml', 'packages/waffle/network/Cargo.toml', 'packages/waffle/network/src/**', 'packages/waffle/tooling/build-network.ts', 'packages/waffle/tooling/network-translator.ts', 'packages/waffle/tooling/network-translator/**', 'packages/waffle/tooling/network-growth.ts') }}
      - name: Restore pinned network translator
        if: steps.select.outputs.libc_or_browser == 'true' && steps.network-artifact.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .network-tools
          key: network-translator-v1-${{ hashFiles('packages/waffle/tooling/network-translator.ts', 'packages/waffle/tooling/network-translator/**') }}
      - name: Restore Rust toolchain for network fallback build
        if: steps.select.outputs.libc_or_browser == 'true' && steps.network-artifact.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/git
            packages/waffle/target
          key: ${{ runner.os }}-${{ runner.arch }}-network-rust-${{ hashFiles('packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml') }}-${{ hashFiles('packages/waffle/network/**/*.rs') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-network-rust-${{ hashFiles('packages/waffle/Cargo.lock', 'packages/waffle/rust-toolchain.toml') }}-
      - uses: dtolnay/rust-toolchain@stable
        if: steps.select.outputs.libc_or_browser == 'true' && steps.network-artifact.outputs.cache-hit != 'true'
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - name: Build network artifact on cache miss
        if: steps.select.outputs.libc_or_browser == 'true' && steps.network-artifact.outputs.cache-hit != 'true'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/waffle/target
          WAFFLE_TOOL_CACHE: ${{ github.workspace }}/.network-tools
        run: bun run --cwd packages/waffle build:network
      - name: Verify exact-input network artifact before installation
        if: steps.select.outputs.libc_or_browser == 'true'
        run: |
