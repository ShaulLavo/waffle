[package]
name = "waffle-tcp"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Portable Waffle TCP state and reference native socket binding"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
socket2 = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
module-tests = []

[dev-dependencies]
wasmi = { version = "0.46", default-features = false, features = ["std"] }

[[test]]
name = "module"
required-features = ["module-tests"]
