[workspace]
members = [
  "packages/program-support",
  "packages/process-consumer",
  "packages/coreutils",
  "packages/coreutils/crates/clear",
  "packages/coreutils/crates/echo",
  "packages/coreutils/crates/date",
  "packages/coreutils/crates/cut",
  "packages/coreutils/crates/tr",
  "packages/coreutils/crates/wc",
  "packages/grep",
  "packages/findutils",
]
exclude = [
  "packages/coreutils/vendor/uutils-env",
  "packages/findutils/vendor/uutils-find",
  "packages/findutils/vendor/uutils-xargs",
]
default-members = [
  "packages/program-support",
  "packages/process-consumer",
  "packages/coreutils",
  "packages/coreutils/crates/clear",
  "packages/coreutils/crates/echo",
  "packages/coreutils/crates/date",
  "packages/coreutils/crates/cut",
  "packages/coreutils/crates/tr",
  "packages/coreutils/crates/wc",
  "packages/grep",
  "packages/findutils",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[patch.crates-io]
bytecount = { path = "packages/coreutils/crates/wc/vendor/bytecount" }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
