[package]
name = "upstream-sed"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
autobins = false

[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "4.4", features = ["wrap_help", "cargo"] }
fancy-regex = "0.19.0"
memchr = "2.7.4"
regex = { version = "1.10.4", features = ["perf-dfa-full"] }
tempfile = "3.10.1"
terminal_size = "0.4.2"
unicode-width = "0.2.2"
uucore = { version = "0.12.0", features = ["diagnostics", "libc"] }

[target.'cfg(unix)'.dependencies]
memmap2 = "0.9"
rustix = "1.1.4"
