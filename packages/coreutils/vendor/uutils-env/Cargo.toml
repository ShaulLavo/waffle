[package]
name = "uu_env"
version = "0.13.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
publish = false
autobins = false

[lib]
path = "src/env.rs"
doctest = false

[dependencies]
clap = { version = "4.5", features = ["wrap_help", "cargo", "color"] }
fluent = "0.17.0"
thiserror = "2.0.3"
uucore = { git = "https://github.com/uutils/coreutils", rev = "07763857f6b9a547742a994b58aef0ccd036198b", features = ["signals"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["process", "signal"] }

[features]
diagnostics = ["uucore/diagnostics"]

[target.'cfg(target_os = "wasi")'.dependencies]
waffle-process-consumer = { path = "../../../process-consumer" }
