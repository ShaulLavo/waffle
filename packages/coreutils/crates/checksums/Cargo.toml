[workspace]
resolver = "3"

[package]
name = "waffle-coreutils-checksums"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[dependencies]
uu_sha256sum = { package = "uu_sha256sum", git = "https://github.com/uutils/coreutils", rev = "07763857f6b9a547742a994b58aef0ccd036198b" }
uu_sha224sum = { package = "uu_sha224sum", git = "https://github.com/uutils/coreutils", rev = "07763857f6b9a547742a994b58aef0ccd036198b" }
uu_sha384sum = { package = "uu_sha384sum", git = "https://github.com/uutils/coreutils", rev = "07763857f6b9a547742a994b58aef0ccd036198b" }
uu_sha512sum = { package = "uu_sha512sum", git = "https://github.com/uutils/coreutils", rev = "07763857f6b9a547742a994b58aef0ccd036198b" }
uu_sha1sum = { package = "uu_sha1sum", git = "https://github.com/uutils/coreutils", rev = "07763857f6b9a547742a994b58aef0ccd036198b" }
uu_md5sum = { package = "uu_md5sum", git = "https://github.com/uutils/coreutils", rev = "07763857f6b9a547742a994b58aef0ccd036198b" }
uu_b2sum = { package = "uu_b2sum", git = "https://github.com/uutils/coreutils", rev = "07763857f6b9a547742a994b58aef0ccd036198b" }
uu_cksum = { package = "uu_cksum", git = "https://github.com/uutils/coreutils", rev = "07763857f6b9a547742a994b58aef0ccd036198b" }
uu_sum = { package = "uu_sum", git = "https://github.com/uutils/coreutils", rev = "07763857f6b9a547742a994b58aef0ccd036198b" }
uucore = { features = ["checksum"], git = "https://github.com/uutils/coreutils", rev = "07763857f6b9a547742a994b58aef0ccd036198b" }

[patch."https://github.com/uutils/coreutils"]
uucore = { path = "../../.sources/checksums/src/uucore" }
uu_checksum_common = { path = "../../.sources/checksums/src/uu/checksum_common" }
uu_sum = { path = "../../.sources/checksums/src/uu/sum" }
