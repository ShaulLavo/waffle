[package]
name = "waffle-date"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
uu_date = { git = "https://github.com/uutils/coreutils", rev = "07763857f6b9a547742a994b58aef0ccd036198b", default-features = false }
uucore = { git = "https://github.com/uutils/coreutils", rev = "07763857f6b9a547742a994b58aef0ccd036198b" }

[[bin]]
name = "date"
path = "src/main.rs"

[package.metadata.cargo-machete]
ignored = ["uu_date", "uucore"]
