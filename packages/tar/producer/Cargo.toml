[package]
name = "waffle-tar-upstream"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[lib]
name = "uu_tar"
path = "../.sources/tar/src/uu/tar/src/tar.rs"

[[bin]]
name = "tar"
path = "../.sources/tar/src/uu/tar/src/main.rs"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
clap = { version = "=4.6.7", features = ["wrap_help", "cargo"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "=0.4.46", default-features = false }
thiserror = "=2.0.18"
uucore = { version = "=0.9.0", features = ["fs"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
