[package]
name = "findutils"
version = "0.11.0"
edition = "2021"
rust-version = "1.88.0"
license = "MIT"
publish = false
autobins = false

[lib]
path = "src/lib.rs"

[dependencies]
argmax = "0.4.0"
chrono = "0.4.45"
faccess = "0.2.4"
nix = { version = "0.31", features = ["fs", "user"] }
onig = { version = "6.5", default-features = false }
parse_datetime = "0.17.0"
regex = "1.12"
uucore = { version = "0.12.0", features = ["diagnostics", "entries", "fs", "fsext", "mode"] }
walkdir = "2.5"
itertools = "0.15.0"
thiserror = "2.0.12"

[target.'cfg(target_os = "wasi")'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["std"] }
