[package]
name = "waffle-findutils-source"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[[bin]]
name = "find"
path = "src/bin/find.rs"

[[bin]]
name = "xargs"
path = "src/bin/xargs.rs"

[dependencies]
findutils = { path = "vendor/uutils-find" }
upstream-xargs = { path = "vendor/uutils-xargs" }
uucore = { version = "=0.12.0", features = ["diagnostics"] }

[dev-dependencies]
tempfile = "3"
